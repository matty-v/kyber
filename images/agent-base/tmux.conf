# System-wide tmux config for Kyber agent pods (#122).
# Shipped at /etc/tmux.conf; per-agent overrides still possible via ~/.tmux.conf
# (tmux reads both; user file wins when present).

# Enable mouse support so wheel events in the PWA xterm auto-enter copy-mode
# and scroll tmux's main-screen scrollback. The PWA also translates wheel
# events to PgUp/PgDn for alt-screen-using apps (Claude Code) — see
# pwa/src/lib/wheelToKeys.ts for the client-side half.
set -g mouse on

# Bump the main-screen scrollback. Default is 2000 lines; 50,000 is ~10x
# without meaningfully growing per-session memory (<5 MiB at typical line
# widths). Operators scanning boot logs / oauth messages want this space.
set -g history-limit 50000

# Signal 256-color support so Claude Code's TUI colors render correctly.
# Without this, tmux defaults to screen and colors collapse to 8-bit.
set -g default-terminal "xterm-256color"
