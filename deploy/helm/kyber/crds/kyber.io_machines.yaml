---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: machines.kyber.io
spec:
  group: kyber.io
  names:
    kind: Machine
    listKind: MachineList
    plural: machines
    shortNames:
    - mc
    singular: machine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .spec.machineType
      name: Type
      type: string
    - jsonPath: .spec.zone
      name: Zone
