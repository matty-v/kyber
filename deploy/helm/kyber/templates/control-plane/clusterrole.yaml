apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyber.fullname" . }}-control-plane
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
rules:
  # Agent CRD management (Agent Controller)
  - apiGroups: ["kyber.io"]
    resources: ["agents"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kyber.io"]
    resources: ["agents/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kyber.io"]
    resources: ["agents/finalizers"]
    verbs: ["update"]
  # Machine CRD management (Machine Controller)
  - apiGroups: ["kyber.io"]
    resources: ["machines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kyber.io"]
    resources: ["machines/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kyber.io"]
    resources: ["machines/finalizers"]
    verbs: ["update"]
  # Pod management (Agent Controller manages agent pods; Machine Controller
  # manages credential-free autoscaling demand pods for regional providers)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Pod exec (debug shell + node agent actions)
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  # Pod log streaming
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # PVC management (Agent Controller — creates agent storage)
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Node management (Machine Controller — maps machines to nodes)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "delete"]
  # Namespace reads — both Agent and Machine reconcilers call
  # isNamespaceTerminating in their handleDeletion paths to detect
  # "namespace is being torn down, skip in-namespace cleanup and
  # self-remove the finalizer" (avoids deadlocking the namespace
  # terminator on a finalizer the controller is being torn down with).
  # controller-runtime's cache spins up a Namespace informer the moment
  # any reconciler does a Namespace Get; without watch permission the
  # informer reflector spams "namespaces is forbidden" every few
  # seconds, eventually wedging the agent workqueue (delete agent
  # stops processing entirely — seen in a production incident
  # where an agent's deletion sat unprocessed for 12+ minutes until the
  # control-plane was rolled).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  # Secret management — the API creates agent secrets (OAuth, API key, Telegram
  # bot token) when a new agent is created via the PWA. The controller also
  # reads secrets for init container auth and mounting resolution, and deletes
  # them during agent cleanup (finalizer cascades labeled secrets). `watch` is
  # required because controller-runtime's cache registers an informer for any
  # type touched by the cached client (r.Get/r.List), and informers LIST+WATCH.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Event emission (Agent + Machine controllers)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Event reads (Agent Controller — populateSchedulingStatus in
  # pkg/controllers/agent/scheduling.go tails FailedScheduling /
  # ImagePullBackOff / FailedMount events to drive the PWA's stuck-Pending
  # banner shipped in kyber#210 PR-A). controller-runtime's cache installs a
  # Watch the first time client.List(&EventList{}) runs, so list+watch are
  # both required — without them the reflector loops "events is forbidden"
  # every ~30s on every control-plane and populateSchedulingStatus silently
  # returns false for every call, leaving the banner permanently invisible.
  # Kept as a separate rule from the create/patch grant above so each
  # consumer's rationale stays grep-discoverable.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  # ConfigMap access (session brief storage, leader election)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Read-only Deployment access for update-ownership detection.
  #
  # The update checker reads the control-plane Deployment's ANNOTATIONS to
  # decide who owns this cluster's resources: `argocd.argoproj.io/tracking-id`
  # means ArgoCD is reconciling and Kyber must not upgrade itself (selfHeal
  # would revert it), `meta.helm.sh/release-name` means a real Helm release.
  #
  # `list` and `watch` are REQUIRED even though this feature only ever Gets a
  # single Deployment: the checker reads through the manager's CACHED client,
  # and controller-runtime registers an informer for any type the cached client
  # touches — informers LIST+WATCH. Same trap as the secrets and namespaces
  # rules above. With get-only, the reflector loops "deployments is forbidden",
  # the informer never syncs, and every read blocks in WaitForCacheSync: the
  # startup check hangs before the ticker loop ever starts, and every
  # GET /api/v1/updates hangs until the client gives up. No write verbs — the
  # absence of create/update/patch/delete is what keeps this read-only, not the
  # absence of list/watch.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  # Leader election coordination (controller-runtime)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if .Values.selfUpgrade.enabled }}
  # Self-upgrade Jobs. The control plane CREATES the upgrade Job and reads its
  # status to report the run; it never runs Helm itself.
  #
  # `list` and `watch` for the same cached-client reason as the deployments
  # rule above — the Applier lists Jobs by label, which registers an informer.
  #
  # No `delete`: a finished upgrade Job is the record of what happened, and the
  # TTL controller reaps it on schedule. Deleting the evidence on the control
  # plane's own initiative is not a power this needs.
  #
  # Gated on selfUpgrade.enabled so an install that has not opted in cannot
  # create Jobs at all, independent of any env var.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  {{- end }}
