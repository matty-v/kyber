apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kyber.fullname" . }}-control-plane
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
data:
  # KYBER_NAMESPACE scopes the control plane's Agent / Machine CR reads and
  # writes. MUST resolve to the release namespace — if it's empty or points
  # at a different namespace, the control plane will read/write CRs in that
  # other namespace. In preview the chart leaves namespace.name="" so the
  # old `{{ .Values.namespace.name }}` would produce an empty string here,
  # the binary would fall back to "kyber-system", and preview PWA activity
  # would create agents in prod. Use the same helper that every other
  # namespace-bearing template uses so the value is always the resolved
  # chart namespace, not the raw input value.
  KYBER_NAMESPACE: {{ include "kyber.namespace" . | quote }}
  # Telemetry config — read by the control plane at startup.
  KYBER_TELEMETRY_ENABLED: {{ .Values.telemetry.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlpEndpoint | quote }}
  # Metrics tab — Redis-backed always-on metrics store.
  KYBER_METRICS_REDIS_STORE_ENABLED: {{ .Values.metrics.redisStoreEnabled | quote }}
  KYBER_METRICS_RETENTION_SECONDS: {{ include "kyber.numericValue" .Values.metrics.redisRetentionSeconds }}
  KYBER_METRICS_PROMETHEUS_URL: {{ .Values.metrics.prometheusURL | quote }}
  KYBER_METRICS_PROMETHEUS_INSECURE: {{ .Values.metrics.prometheusInsecureSkipVerify | quote }}
  # Bounded agent request/reply defensive limits. Exposure is gated per Agent.
  KYBER_AGENT_REQUESTS_LIFETIME_SECONDS: {{ include "kyber.numericValue" .Values.api.agentRequests.lifetimeSeconds }}
  KYBER_AGENT_REQUESTS_MAX_PROMPT_BYTES: {{ include "kyber.numericValue" .Values.api.agentRequests.maxPromptBytes }}
  KYBER_AGENT_REQUESTS_MAX_CORRELATION_BYTES: {{ include "kyber.numericValue" .Values.api.agentRequests.maxCorrelationBytes }}
  KYBER_AGENT_REQUESTS_MAX_RESPONSE_BYTES: {{ include "kyber.numericValue" .Values.api.agentRequests.maxResponseBytes }}
  KYBER_AGENT_REQUESTS_MAX_OUTSTANDING: {{ include "kyber.numericValue" .Values.api.agentRequests.maxOutstanding }}
  KYBER_AGENT_REQUESTS_MAX_TERMINAL: {{ include "kyber.numericValue" .Values.api.agentRequests.maxTerminal }}
  KYBER_TASKS_ENABLED: {{ .Values.api.durableTasks.enabled | quote }}
  KYBER_A2A_ENABLED: {{ .Values.api.a2a.enabled | quote }}
  KYBER_TASKS_MAX_PROMPT_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxPromptBytes }}
  KYBER_TASKS_MAX_CORRELATION_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxCorrelationBytes }}
  KYBER_TASKS_MAX_RESPONSE_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxResponseBytes }}
  KYBER_TASKS_MAX_OUTSTANDING: {{ include "kyber.numericValue" .Values.api.durableTasks.maxOutstanding }}
  KYBER_TASKS_MAX_RETAINED: {{ include "kyber.numericValue" .Values.api.durableTasks.maxRetained }}
  KYBER_TASKS_MAX_DISPATCH_ATTEMPTS: {{ include "kyber.numericValue" .Values.api.durableTasks.maxDispatchAttempts }}
  KYBER_TASKS_MAX_PROGRESS_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxProgressBytes }}
  KYBER_TASKS_MAX_PROGRESS_UPDATES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxProgressUpdates }}
  KYBER_TASKS_MAX_RESULTS: {{ include "kyber.numericValue" .Values.api.durableTasks.maxResults }}
  KYBER_TASKS_MAX_RESULT_PARTS: {{ include "kyber.numericValue" .Values.api.durableTasks.maxResultParts }}
  KYBER_TASKS_MAX_TEXT_PART_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxTextPartBytes }}
  KYBER_TASKS_MAX_JSON_PART_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxJSONPartBytes }}
  KYBER_TASKS_MAX_FILE_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxFileBytes }}
  KYBER_TASKS_MAX_TASK_FILE_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxTaskFileBytes }}
  KYBER_TASKS_MAX_RESULT_NAME_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxResultNameBytes }}
  KYBER_TASKS_MAX_DESCRIPTION_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxDescriptionBytes }}
  KYBER_TASKS_MAX_FILENAME_BYTES: {{ include "kyber.numericValue" .Values.api.durableTasks.maxFilenameBytes }}
  KYBER_TASK_RESULTS_ROOT: {{ .Values.api.durableTasks.resultsRoot | quote }}
  KYBER_TASKS_DEFAULT_DEADLINE_HOURS: {{ include "kyber.numericValue" .Values.api.durableTasks.defaultDeadlineHours }}
  KYBER_TASKS_MAX_DEADLINE_HOURS: {{ include "kyber.numericValue" .Values.api.durableTasks.maxDeadlineHours }}
  KYBER_TASKS_RETENTION_HOURS: {{ include "kyber.numericValue" .Values.api.durableTasks.retentionHours }}
