apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kyber.fullname" . }}-control-plane
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
data:
  # KYBER_NAMESPACE scopes the control plane's Agent / Machine CR reads and
  # writes. MUST resolve to the release namespace — if it's empty or points
  # at a different namespace, the control plane will read/write CRs in that
  # other namespace. In preview the chart leaves namespace.name="" so the
  # old `{{ .Values.namespace.name }}` would produce an empty string here,
  # the binary would fall back to "kyber-system", and preview PWA activity
  # would create agents in prod. Use the same helper that every other
  # namespace-bearing template uses so the value is always the resolved
  # chart namespace, not the raw input value.
  KYBER_NAMESPACE: {{ include "kyber.namespace" . | quote }}
  # Telemetry config — read by the control plane at startup.
  KYBER_TELEMETRY_ENABLED: {{ .Values.telemetry.enabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.telemetry.otlpEndpoint | quote }}
  # Metrics tab — Redis-backed always-on metrics store.
  KYBER_METRICS_REDIS_STORE_ENABLED: {{ .Values.metrics.redisStoreEnabled | quote }}
  KYBER_METRICS_RETENTION_SECONDS: {{ .Values.metrics.redisRetentionSeconds | quote }}
  KYBER_METRICS_PROMETHEUS_URL: {{ .Values.metrics.prometheusURL | quote }}
  KYBER_METRICS_PROMETHEUS_INSECURE: {{ .Values.metrics.prometheusInsecureSkipVerify | quote }}
  # Bounded agent request/reply defensive limits. Exposure is gated per Agent.
  KYBER_AGENT_REQUESTS_LIFETIME_SECONDS: {{ .Values.api.agentRequests.lifetimeSeconds | quote }}
  KYBER_AGENT_REQUESTS_MAX_PROMPT_BYTES: {{ .Values.api.agentRequests.maxPromptBytes | quote }}
  KYBER_AGENT_REQUESTS_MAX_CORRELATION_BYTES: {{ .Values.api.agentRequests.maxCorrelationBytes | quote }}
  KYBER_AGENT_REQUESTS_MAX_RESPONSE_BYTES: {{ .Values.api.agentRequests.maxResponseBytes | quote }}
  KYBER_AGENT_REQUESTS_MAX_OUTSTANDING: {{ .Values.api.agentRequests.maxOutstanding | quote }}
  KYBER_AGENT_REQUESTS_MAX_TERMINAL: {{ .Values.api.agentRequests.maxTerminal | quote }}
  KYBER_TASKS_ENABLED: {{ .Values.api.durableTasks.enabled | quote }}
  KYBER_A2A_ENABLED: {{ .Values.api.a2a.enabled | quote }}
  KYBER_TASKS_MAX_PROMPT_BYTES: {{ .Values.api.durableTasks.maxPromptBytes | quote }}
  KYBER_TASKS_MAX_CORRELATION_BYTES: {{ .Values.api.durableTasks.maxCorrelationBytes | quote }}
  KYBER_TASKS_MAX_RESPONSE_BYTES: {{ .Values.api.durableTasks.maxResponseBytes | quote }}
  KYBER_TASKS_MAX_OUTSTANDING: {{ .Values.api.durableTasks.maxOutstanding | quote }}
  KYBER_TASKS_MAX_RETAINED: {{ .Values.api.durableTasks.maxRetained | quote }}
  KYBER_TASKS_MAX_DISPATCH_ATTEMPTS: {{ .Values.api.durableTasks.maxDispatchAttempts | quote }}
  KYBER_TASKS_MAX_PROGRESS_BYTES: {{ .Values.api.durableTasks.maxProgressBytes | quote }}
  KYBER_TASKS_MAX_PROGRESS_UPDATES: {{ .Values.api.durableTasks.maxProgressUpdates | quote }}
  KYBER_TASKS_MAX_RESULTS: {{ .Values.api.durableTasks.maxResults | quote }}
  KYBER_TASKS_MAX_RESULT_PARTS: {{ .Values.api.durableTasks.maxResultParts | quote }}
  KYBER_TASKS_MAX_TEXT_PART_BYTES: {{ .Values.api.durableTasks.maxTextPartBytes | quote }}
  KYBER_TASKS_MAX_JSON_PART_BYTES: {{ .Values.api.durableTasks.maxJSONPartBytes | quote }}
  KYBER_TASKS_MAX_FILE_BYTES: {{ .Values.api.durableTasks.maxFileBytes | quote }}
  KYBER_TASKS_MAX_TASK_FILE_BYTES: {{ .Values.api.durableTasks.maxTaskFileBytes | quote }}
  KYBER_TASKS_MAX_RESULT_NAME_BYTES: {{ .Values.api.durableTasks.maxResultNameBytes | quote }}
  KYBER_TASKS_MAX_DESCRIPTION_BYTES: {{ .Values.api.durableTasks.maxDescriptionBytes | quote }}
  KYBER_TASKS_MAX_FILENAME_BYTES: {{ .Values.api.durableTasks.maxFilenameBytes | quote }}
  KYBER_TASK_RESULTS_ROOT: {{ .Values.api.durableTasks.resultsRoot | quote }}
  KYBER_TASKS_DEFAULT_DEADLINE_HOURS: {{ .Values.api.durableTasks.defaultDeadlineHours | quote }}
  KYBER_TASKS_MAX_DEADLINE_HOURS: {{ .Values.api.durableTasks.maxDeadlineHours | quote }}
  KYBER_TASKS_RETENTION_HOURS: {{ .Values.api.durableTasks.retentionHours | quote }}
