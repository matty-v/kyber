{{- /*
API credentials Secret.

PRESERVES the live api-key and webhook-secret across `helm upgrade`, for the
same reason the fleet-defaults ConfigMap does: POST /api/v1/rotate-api-key
patches `api-key` on this Secret at runtime, so rendering straight from
.Values would revert a rotation.

That is the security-critical direction. Scenario on the chart-default path
(no api.existingSecret): an operator rotates the key after a leak, the next
self-upgrade reverts it to the chart value, the LEAKED key works again, and
every client holding the rotated key gets 401. Missed in the first pass of
this change and caught in review — all four known clusters set
api.existingSecret, so it was invisible here, but a fresh OSS install has no
such protection.

hasKey rather than truthiness throughout: an empty-but-present field is a
real state, and `default` would treat it as unset.
*/ -}}
{{- if not .Values.api.existingSecret }}
{{- if or .Values.api.apiKey .Values.api.webhookSecret .Values.k3s.joinToken .Values.k3s.serverUrl }}
{{- $credName := printf "%s-api-credentials" (include "kyber.fullname" .) }}
{{- $liveCreds := lookup "v1" "Secret" (include "kyber.namespace" .) $credName }}
{{- $liveData := dict }}
{{- if $liveCreds }}{{- $liveData = ($liveCreds.data | default dict) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kyber.fullname" . }}-api-credentials
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    # Do not store actual secret values in version control.
    # Supply values via --set api.apiKey=... or a values override file.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  api-key: {{ if hasKey $liveData "api-key" }}{{ index $liveData "api-key" | b64dec | quote }}{{ else }}{{ .Values.api.apiKey | quote }}{{ end }}
  webhook-secret: {{ if hasKey $liveData "webhook-secret" }}{{ index $liveData "webhook-secret" | b64dec | quote }}{{ else }}{{ .Values.api.webhookSecret | quote }}{{ end }}
  {{- if and (not .Values.k3s.existingSecret) .Values.k3s.joinToken }}
  k3s-join-token: {{ .Values.k3s.joinToken | quote }}
  {{- end }}
  {{- if and (not .Values.k3s.existingSecret) .Values.k3s.serverUrl }}
  k3s-server-url: {{ .Values.k3s.serverUrl | quote }}
  {{- end }}
{{- end }}
{{- end }}
