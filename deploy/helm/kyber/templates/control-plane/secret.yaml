{{- if not .Values.api.existingSecret }}
{{- if or .Values.api.apiKey .Values.api.webhookSecret .Values.k3s.joinToken .Values.k3s.serverUrl }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kyber.fullname" . }}-api-credentials
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    # Do not store actual secret values in version control.
    # Supply values via --set api.apiKey=... or a values override file.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  api-key: {{ .Values.api.apiKey | quote }}
  webhook-secret: {{ .Values.api.webhookSecret | quote }}
  {{- if and (not .Values.k3s.existingSecret) .Values.k3s.joinToken }}
  k3s-join-token: {{ .Values.k3s.joinToken | quote }}
  {{- end }}
  {{- if and (not .Values.k3s.existingSecret) .Values.k3s.serverUrl }}
  k3s-server-url: {{ .Values.k3s.serverUrl | quote }}
  {{- end }}
{{- end }}
{{- end }}
