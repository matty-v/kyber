{{- if .Values.runtimeDetect.enabled }}
{{- if not .Values.runtimeDetect.existingSecret }}
# Anthropic API key Secret used by the runtime detection poller
# (kyber#375 PR-A of #374). The chart renders this Secret with the
# operator-supplied value from runtimeDetect.anthropicApiKey (defaults to
# empty — the canonical write path is PUT /api/v1/settings/anthropic-key
# from the PWA Settings panel). helm.sh/resource-policy: keep so a
# `helm uninstall` doesn't wipe the operator-entered key from the
# cluster.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kyber.anthropicKeySecretName" . }}
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    # Preserve the operator-entered key across `helm uninstall` —
    # mirrors the api-credentials Secret's policy.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  api-key: {{ .Values.runtimeDetect.anthropicApiKey | quote }}
{{- end }}
{{- end }}
