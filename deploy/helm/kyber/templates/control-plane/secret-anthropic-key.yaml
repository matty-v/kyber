{{- if .Values.runtimeDetect.enabled }}
{{- if not .Values.runtimeDetect.existingSecret }}
{{- /*
Anthropic API key Secret used by the runtime detection poller
(kyber#375 PR-A of #374). The canonical write path is
PUT /api/v1/settings/anthropic-key from the PWA Settings panel;
runtimeDetect.anthropicApiKey defaults to empty.

PRECEDENCE — the LIVE value wins; the chart value is a first-install SEED.
Same rule as the fleet-defaults ConfigMap, for the same reason: a cluster's
config lives in the cluster (Matt, 2026-08-10).

  1. The live Secret's api-key, read via `lookup` — what the PWA wrote.
  2. runtimeDetect.anthropicApiKey, to seed a first install.
  3. Empty.

Why the live tier exists: this template used to render `api-key` straight from
`.Values`, which defaults to "". `helm.sh/resource-policy: keep` protects
the Secret from `helm uninstall` but NOT from `helm upgrade` — so an
upgrade would have written an empty key straight over the operator's,
silently breaking model discovery fleet-wide. That never fired because
nothing ran `helm upgrade`; ArgoCD renders and applies, and the per-cluster
`ignoreDifferences` on /data/api-key covered it. Making Kyber upgrade
ITSELF via Helm arms that bug, and an automatic overnight upgrade would
have been the first thing to pull the trigger. See dave-agent spec
2026-08-10-kyber-owns-its-deployment.md.

`lookup` returns nothing without cluster access (ArgoCD's repo-server,
plain `helm template`), in which case this falls through to the chart value —
the behaviour that exists today, still covered by ignoreDifferences on
ArgoCD-managed clusters.
*/ -}}
{{- $secretName := include "kyber.anthropicKeySecretName" . }}
{{- $live := lookup "v1" "Secret" (include "kyber.namespace" .) $secretName }}
{{- $prevKey := "" }}
{{- if $live }}{{- $prevKey = (index ($live.data | default dict) "api-key" | default "" | b64dec) }}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
  annotations:
    # Preserve the operator-entered key across `helm uninstall` —
    # mirrors the api-credentials Secret's policy. Note this does NOT
    # protect against `helm upgrade`; the `lookup` above does that.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  api-key: {{ $prevKey | default .Values.runtimeDetect.anthropicApiKey | default "" | quote }}
{{- end }}
{{- end }}
