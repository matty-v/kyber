{{- if ge (int (index .Chart.Annotations "kyber.io/operator-credential-authority-protocol" | default "0")) 1 }}
# The handoff worker has namespace-only authority. It cannot change workloads,
# delete Jobs or touch Agent storage. Keep unresolved execution evidence.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyber.fullname" . }}-credential-adoption
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kyber.fullname" . }}-credential-adoption
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kyber-operator-credentials", "kyber-operator-credentials-maintenance"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kyber-operator-credentials-maintenance"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kyber.fullname" . }}-credential-adoption
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kyber.fullname" . }}-credential-adoption
subjects:
  - kind: ServiceAccount
    name: {{ include "kyber.fullname" . }}-credential-adoption
    namespace: {{ include "kyber.namespace" . }}
{{- end }}
