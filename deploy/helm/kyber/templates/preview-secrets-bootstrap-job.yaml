{{- if and .Values.preview.enabled .Values.preview.bootstrapSecrets }}
{{/*
Preview Secrets Bootstrap — pre-install Job that idempotently creates the
api-credentials and postgres Secrets if they don't already exist.

Wave -11: ServiceAccount + RBAC created first so the Job (wave -10) can use them.
The Job itself runs at pre-install / pre-upgrade so secrets are ready before the
main chart resources (control-plane, postgres StatefulSet) are applied.

Idempotency: the Job checks with `kubectl get secret --ignore-not-found` before
creating. Re-running on upgrade is safe — existing secrets are left unchanged.
*/}}

{{- $credSecret := include "kyber.previewCredentialsSecretName" . }}
{{- $pgSecret   := include "kyber.previewPostgresSecretName" . }}
{{- $ns         := include "kyber.namespace" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kyber.fullname" . }}-bootstrap
subjects:
  - kind: ServiceAccount
    name: {{ include "kyber.fullname" . }}-bootstrap
    namespace: {{ $ns }}
{{- if .Values.preview.copyGithubAppSecret }}
---
# Narrowly-scoped ClusterRole: read-only access to ONE specific Secret in
# the prod namespace so the bootstrap Job can copy the GitHub App creds
# into this preview. Any change to this rule should be reviewed carefully —
# it's the only cluster-scoped privilege the preview bootstrap holds.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap-githubapp-read
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.preview.githubAppSecretName }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap-githubapp-read
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kyber.fullname" . }}-bootstrap-githubapp-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kyber.fullname" . }}-bootstrap
    namespace: {{ $ns }}
{{- end }}
{{- if and .Values.preview.devApiKeySecretName .Values.preview.devApiKeySourceNamespace }}
---
# Narrowly-scoped ClusterRole: read-only access to ONE specific Secret — the
# shared deterministic dev API key (kyber#498) — in a fixed source namespace,
# so the bootstrap Job can seed it into this preview's api-credentials Secret.
# Only rendered when the key lives outside the preview namespace; the existing
# namespaced Role already covers a same-namespace read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap-devkey-read
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["{{ .Values.preview.devApiKeySecretName }}"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap-devkey-read
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-11"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-11"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kyber.fullname" . }}-bootstrap-devkey-read
subjects:
  - kind: ServiceAccount
    name: {{ include "kyber.fullname" . }}-bootstrap
    namespace: {{ $ns }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kyber.fullname" . }}-bootstrap
  namespace: {{ $ns }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: preview-bootstrap
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Allow up to 3 retries in case the API server is briefly unavailable.
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kyber.selectorLabels" . | nindent 8 }}
        {{- include "kyber.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: preview-bootstrap
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "kyber.fullname" . }}-bootstrap
      containers:
        - name: bootstrap
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              NS="{{ $ns }}"
              CRED_SECRET="{{ $credSecret }}"
              PG_SECRET="{{ $pgSecret }}"

              # Generate a random alphanumeric string of the requested length
              # using /dev/urandom — no openssl required.
              rand_str() {
                tr -dc 'a-zA-Z0-9' < /dev/urandom | head -c "$1"
              }

              echo "Bootstrap: checking secrets in namespace ${NS}"

              # --- api-credentials Secret ---
              if kubectl get secret "${CRED_SECRET}" -n "${NS}" --ignore-not-found | grep -q "${CRED_SECRET}"; then
                echo "  ${CRED_SECRET} already exists — skipping"
              else
                echo "  Creating ${CRED_SECRET}"
                API_KEY=""
                {{- if .Values.preview.devApiKeySecretName }}
                # Deterministic dev API key (kyber#498): the no-kubeconfig CI
                # verification probe authenticates with a key it already knows.
                # Seed api-key from the shared dev Secret (same value as the CI
                # secret KYBER_DEV_PROBE_API_KEY) instead of a random per-PR key.
                # Falls back to random if the shared Secret is absent/empty so a
                # missing prereq degrades to a working (if un-probeable) preview.
                DEVKEY_SECRET="{{ .Values.preview.devApiKeySecretName }}"
                DEVKEY_NS="{{ .Values.preview.devApiKeySourceNamespace | default $ns }}"
                if kubectl get secret "${DEVKEY_SECRET}" -n "${DEVKEY_NS}" --ignore-not-found | grep -q "${DEVKEY_SECRET}"; then
                  API_KEY="$(kubectl get secret "${DEVKEY_SECRET}" -n "${DEVKEY_NS}" -o jsonpath='{.data.api-key}' | base64 -d)"
                  echo "  Seeding deterministic dev api-key from ${DEVKEY_NS}/${DEVKEY_SECRET}"
                else
                  echo "  WARNING: dev key Secret ${DEVKEY_NS}/${DEVKEY_SECRET} not found — falling back to a random api-key (CI probe will not be able to authenticate)"
                fi
                {{- end }}
                if [ -z "${API_KEY}" ]; then
                  API_KEY="$(rand_str 32)"
                fi
                kubectl create secret generic "${CRED_SECRET}" \
                  -n "${NS}" \
                  --from-literal=api-key="${API_KEY}"
                echo "  Created ${CRED_SECRET}"
              fi

              # --- postgres Secret ---
              if kubectl get secret "${PG_SECRET}" -n "${NS}" --ignore-not-found | grep -q "${PG_SECRET}"; then
                echo "  ${PG_SECRET} already exists — skipping"
              else
                echo "  Creating ${PG_SECRET}"
                PG_PASSWORD="$(rand_str 24)"
                kubectl create secret generic "${PG_SECRET}" \
                  -n "${NS}" \
                  --from-literal=postgres-password="${PG_PASSWORD}"
                echo "  Created ${PG_SECRET}"
              fi

              {{- if .Values.preview.copyGithubAppSecret }}
              # --- copy kyber-github-app from the prod namespace ---
              # Preview installs share the same GitHub App as prod. Without
              # this, identity-repo auto-create fails with "github App client
              # not configured on control plane" until an operator copies the
              # Secret by hand. Read the three fields explicitly and re-create
              # — avoids the metadata-stripping dance of kubectl get -o yaml |
              # kubectl apply. Idempotent — skip if already present.
              GHAPP_SECRET="{{ .Values.preview.githubAppSecretName }}"
              GHAPP_SRC_NS="{{ .Values.preview.githubAppSourceNamespace }}"
              if kubectl get secret "${GHAPP_SECRET}" -n "${NS}" --ignore-not-found | grep -q "${GHAPP_SECRET}"; then
                echo "  ${GHAPP_SECRET} already exists in ${NS} — skipping"
              elif kubectl get secret "${GHAPP_SECRET}" -n "${GHAPP_SRC_NS}" --ignore-not-found | grep -q "${GHAPP_SECRET}"; then
                echo "  Copying ${GHAPP_SECRET} from ${GHAPP_SRC_NS} to ${NS}"
                APP_ID=$(kubectl get secret "${GHAPP_SECRET}" -n "${GHAPP_SRC_NS}" -o jsonpath='{.data.app-id}' | base64 -d)
                INST_ID=$(kubectl get secret "${GHAPP_SECRET}" -n "${GHAPP_SRC_NS}" -o jsonpath='{.data.installation-id}' | base64 -d)
                PK_FILE=$(mktemp)
                trap 'rm -f "${PK_FILE}"' EXIT
                kubectl get secret "${GHAPP_SECRET}" -n "${GHAPP_SRC_NS}" -o jsonpath='{.data.private-key\.pem}' | base64 -d > "${PK_FILE}"
                kubectl create secret generic "${GHAPP_SECRET}" -n "${NS}" \
                  --from-literal=app-id="${APP_ID}" \
                  --from-literal=installation-id="${INST_ID}" \
                  --from-file=private-key.pem="${PK_FILE}"
                echo "  Copied ${GHAPP_SECRET}"
              else
                echo "  WARNING: ${GHAPP_SECRET} not found in ${GHAPP_SRC_NS} — preview agents with identity repos will fail scaffolding"
              fi
              {{- end }}

              echo "Bootstrap complete."
{{- end }}
