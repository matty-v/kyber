{{- if .Values.storage.gcePD.enabled }}
{{- if eq .Values.storage.gcePD.replicationType "regional-pd" }}
{{- if or .Values.storage.gcePD.allowedZones .Values.compute.gke.nodeLocations }}
{{- if ne (len .Values.storage.gcePD.allowedZones) 2 }}
{{- fail "storage.gcePD.allowedZones must contain exactly two zones when replicationType=regional-pd" }}
{{- end }}

{{- range .Values.compute.gke.nodeLocations }}
{{- if not (has . $.Values.storage.gcePD.allowedZones) }}
{{- fail (printf "compute.gke.nodeLocations zone %s is not present in storage.gcePD.allowedZones" .) }}
{{- end }}
{{- end }}

{{- end }}
{{- end }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.gcePD.storageClassName }}
  annotations:
    # StorageClass.parameters is immutable — k8s rejects in-place patches.
    # Replace=true tells ArgoCD to delete + recreate the SC during sync
    # whenever a parameter changes (e.g. type, replication-type), so chart
    # bumps don't fail with "Forbidden: updates to parameters are forbidden"
    # and require a manual `kubectl delete sc` to unstick. Safe — the SC
    # itself holds no data; existing bound PVCs are unaffected by SC
    # delete/recreate. See kyber-gcp incident 2026-04-26 (kyber-deploy#18).
    argocd.argoproj.io/sync-options: Replace=true
provisioner: pd.csi.storage.gke.io
# Delete lets PVC deletion cascade to PV deletion and (via the CSI driver)
# to the underlying GCE disk. Retain was the earlier default and was the
# root cause of kyber#152 — orphan GCE disks piling up on every agent
# delete. Agent PVCs are per-agent ephemeral workdirs; there is no value
# in retaining the underlying disk after the Agent CR is gone.
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: {{ .Values.storage.gcePD.diskType }}
  replication-type: {{ .Values.storage.gcePD.replicationType }}
{{- if .Values.storage.gcePD.allowedZones }}
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.gke.io/zone
        values:
{{- range .Values.storage.gcePD.allowedZones }}
          - {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}

{{- if .Values.storage.awsEBS.enabled }}
{{- if .Values.storage.gcePD.enabled }}{{ fail "storage.gcePD and storage.awsEBS cannot both be enabled" }}{{- end }}
{{- if not .Values.storage.awsEBS.encrypted }}{{ fail "storage.awsEBS.encrypted must be true" }}{{- end }}
{{- if ne .Values.storage.awsEBS.type "gp3" }}{{ fail "storage.awsEBS.type must be gp3" }}{{- end }}
{{- if not .Values.storage.awsEBS.allowedZones }}{{ fail "storage.awsEBS.allowedZones must contain at least one availability zone" }}{{- end }}
{{- if not (has .Values.storage.awsEBS.fsType (list "ext4" "xfs")) }}{{ fail "storage.awsEBS.fsType must be ext4 or xfs" }}{{- end }}
{{- if and .Values.storage.agentStorageClass (ne .Values.storage.agentStorageClass .Values.storage.awsEBS.storageClassName) }}{{ fail "storage.agentStorageClass must match storage.awsEBS.storageClassName when AWS EBS is enabled" }}{{- end }}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.storage.awsEBS.storageClassName }}
provisioner: ebs.csi.aws.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: {{ .Values.storage.awsEBS.allowVolumeExpansion }}
parameters:
  type: {{ .Values.storage.awsEBS.type | quote }}
  encrypted: "true"
  csi.storage.k8s.io/fstype: {{ .Values.storage.awsEBS.fsType | quote }}
{{- if .Values.storage.awsEBS.kmsKeyArn }}
  kmsKeyId: {{ .Values.storage.awsEBS.kmsKeyArn | quote }}
{{- end }}
allowedTopologies:
  - matchLabelExpressions:
      - key: topology.ebs.csi.aws.com/zone
        values:
{{- range .Values.storage.awsEBS.allowedZones }}
          - {{ . | quote }}
{{- end }}
{{- end }}
