{{- if and .Values.agentArchives.enabled (eq .Values.agentArchives.storage.backend "builtin") }}
{{- /*
  Kyber archive store (MAT-87/MAT-88): where agent disk exports live when no
  object storage is configured, which is the default on every installation
  target. One replica, Recreate, one RWO volume on
  the installation's default StorageClass (or agentArchives.storage.builtin.
  storageClassName). It holds sealed archives only — the control plane encrypts
  before writing — and is reachable only from the control plane (Service is
  ClusterIP; NetworkPolicy below admits the control plane alone).

  Token: shared bearer token between control plane and store, from a
  chart-created Secret stabilised by lookup, or a pre-created existingSecret
  (key "token") for GitOps installs where lookup cannot see the cluster.
*/}}
{{- /*
  No StorageClass named and no default one: the claim would sit Pending, the
  store would never become ready, and `helm upgrade --wait` (and so the
  self-upgrade Job) would time out and roll back. EKS 1.30+ clusters have no
  default class. Refuse at render time with the fix instead. Only checked when
  the cluster is visible (lookup is empty under `helm template`/GitOps) and the
  claim does not already exist (an existing claim is already bound).
*/}}
{{- $builtin := .Values.agentArchives.storage.builtin }}
{{- if not $builtin.storageClassName }}
{{- $claim := lookup "v1" "PersistentVolumeClaim" (include "kyber.namespace" .) (printf "%s-archive-store" (include "kyber.fullname" .)) }}
{{- $classes := lookup "storage.k8s.io/v1" "StorageClass" "" "" }}
{{- if and (not $claim) (hasKey $classes "items") }}
{{- $hasDefault := false }}
{{- range $classes.items }}
{{- $ann := .metadata.annotations | default dict }}
{{- if or (eq (index $ann "storageclass.kubernetes.io/is-default-class" | default "") "true") (eq (index $ann "storageclass.beta.kubernetes.io/is-default-class" | default "") "true") }}
{{- $hasDefault = true }}
{{- end }}
{{- end }}
{{- if not $hasDefault }}
{{- fail "agentArchives: this cluster has no default StorageClass, so the built-in archive store's volume would never bind. Set agentArchives.storage.builtin.storageClassName (on EKS, the class Kyber uses for agents, e.g. kyber-ebs), use agentArchives.storage.backend s3 or gcs, or set agentArchives.enabled=false." }}
{{- end }}
{{- end }}
{{- end }}
{{- $secretName := .Values.agentArchives.storage.builtin.existingSecret | default (printf "%s-archive-store" (include "kyber.fullname" .)) }}
{{- if not .Values.agentArchives.storage.builtin.existingSecret }}
{{- $existing := lookup "v1" "Secret" (include "kyber.namespace" .) $secretName }}
{{- $token := "" }}
{{- if $existing }}
  {{- $token = index $existing.data "token" | b64dec }}
{{- else }}
  {{- $token = randAlphaNum 48 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-store
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kyber.fullname" . }}-archive-store
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-store
  annotations:
    # Archives are recoverable data (the source agents still exist); keep the
    # volume on uninstall only if the operator asks for it.
    {{- if .Values.agentArchives.storage.builtin.keepOnUninstall }}
    helm.sh/resource-policy: keep
    {{- end }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.agentArchives.storage.builtin.size | quote }}
  {{- if .Values.agentArchives.storage.builtin.storageClassName }}
  storageClassName: {{ .Values.agentArchives.storage.builtin.storageClassName | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kyber.fullname" . }}-archive-store
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-store
spec:
  replicas: 1
  # The volume is RWO: never run two replicas, and never overlap a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kyber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: archive-store
  template:
    metadata:
      labels:
        {{- include "kyber.selectorLabels" . | nindent 8 }}
        {{- include "kyber.podLabels" . | nindent 8 }}
        app.kubernetes.io/component: archive-store
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- /* Unset placement follows the control plane: the store serves only
             the control plane, and wherever an installation puts that is
             platform ground an agent Machine's deletion cannot take away. */}}
      {{- with ($builtin.nodeSelector | default .Values.controlPlane.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($builtin.tolerations | default .Values.controlPlane.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $builtin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: archive-store
          image: {{ include "kyber.image" (dict "repo" .Values.image.controlPlane.repository "tag" .Values.image.controlPlane.tag) }}
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy | default "IfNotPresent" }}
          command: ["/usr/local/bin/kyber-archive-store"]
          env:
            - name: KYBER_ARCHIVE_STORE_DIR
              value: /data/archives
            - name: KYBER_ARCHIVE_STORE_ADDR
              value: ":8090"
            - name: KYBER_ARCHIVE_STORE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: token
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.agentArchives.storage.builtin.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kyber.fullname" . }}-archive-store
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kyber.fullname" . }}-archive-store
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-store
spec:
  type: ClusterIP
  selector:
    {{- include "kyber.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: archive-store
  ports:
    - name: http
      port: 8090
      targetPort: http
{{- if .Values.networkPolicy.enabled }}
---
# Only the control plane may reach the archive store. Agent and archive pods
# never talk to it directly; they go through the control plane's per-job
# endpoints.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kyber.fullname" . }}-archive-store
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: archive-store
spec:
  podSelector:
    matchLabels:
      {{- include "kyber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: archive-store
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "kyber.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: control-plane
      ports:
        - protocol: TCP
          port: 8090
{{- end }}
{{- end }}
