{{- if .Values.metrics.tokenRatesConfigMapName }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.metrics.tokenRatesConfigMapName }}
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
data:
  # provider-rates.yaml is NOT hand-authored (kyber#487). Its content is the
  # build-time vendored projection of LiteLLM's public model-prices feed,
  # regenerated by the weekly refresh-bot PR (cmd/fetch-provider-rates). The
  # runtime read path (KYBER_METRICS_TOKEN_RATES_PATH → this ConfigMap) is
  # unchanged; only the source of its content shifted from operator-typed to
  # feed-derived-and-reviewed. Any model the feed doesn't cover renders the
  # fail-loud "unpriced"/"—" badge, never a believable $0.00.
  provider-rates.yaml: |
{{ .Files.Get "files/provider-rates.generated.yaml" | indent 4 }}
{{- end }}
