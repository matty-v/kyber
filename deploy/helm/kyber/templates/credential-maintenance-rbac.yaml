{{- if ge (int (index .Chart.Annotations "kyber.io/operator-credential-authority-protocol" | default "0")) 1 }}
{{/*
Native credential adoption and recovery use supervised Jobs in this namespace.
The protocol-zero runtime never activates these paths and receives no new grant.
No Job delete: unresolved writer evidence must survive for verified recovery.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kyber.fullname" . }}-credential-maintenance
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kyber.fullname" . }}-credential-maintenance
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kyber.fullname" . }}-credential-maintenance
subjects:
  - kind: ServiceAccount
    name: {{ include "kyber.fullname" . }}-control-plane
    namespace: {{ include "kyber.namespace" . }}
{{- end }}
