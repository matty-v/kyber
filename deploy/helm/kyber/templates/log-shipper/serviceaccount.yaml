{{- if .Values.logShipper.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kyber.fullname" . }}-log-shipper
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
---
# Vector's kubernetes_logs source enriches each line with pod metadata (notably
# the kyber.io/agent label used to key the object path), which requires read
# access to pods, namespaces, and nodes. Nodes is required for node-level
# metadata enrichment (VECTOR_SELF_NODE_NAME lookup); without it Vector retries
# in a tight loop, floods logs, and may suppress useful sink diagnostics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kyber.fullname" . }}-log-shipper
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kyber.fullname" . }}-log-shipper
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: log-shipper
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kyber.fullname" . }}-log-shipper
subjects:
  - kind: ServiceAccount
    name: {{ include "kyber.fullname" . }}-log-shipper
    namespace: {{ include "kyber.namespace" . }}
{{- end }}
