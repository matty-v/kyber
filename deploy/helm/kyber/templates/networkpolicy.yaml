{{- if .Values.networkPolicy.enabled }}
---
# Agent pods accept no pod-network ingress. Runtime/sidecar communication uses
# loopback inside one pod and is unaffected. Applying this policy to every
# kyber.io/agent-labelled pod prevents agent-to-agent connections while leaving
# outbound access available for autonomous work.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kyber.fullname" . }}-agent-default-deny-ingress
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-isolation
spec:
  podSelector:
    matchExpressions:
      - key: kyber.io/agent
        operator: Exists
  policyTypes:
    - Ingress
  ingress: []
{{- if .Values.agent.security.egress.enabled }}
---
# Agent egress (kyber#78, AC3/AC4/AC6).
#
# #77 denied ingress only, which left three criteria unmet: from an ordinary
# pod on this cluster the kubelet (:10250) and the API server (:443) were both
# reachable, and an agent could still scan the pod CIDR to find its neighbours.
# Denying ingress stops connections INTO an agent; it does nothing about what
# the agent reaches out to.
#
# The shape is allow-the-internet, deny-the-infrastructure: an agent keeps
# unrestricted outbound access for its actual work (package registries, git
# forges, model APIs) and loses the private ranges where the node, the control
# interfaces, the cloud metadata service and its neighbouring agents live.
#
# The DNS and control-plane rules are separate allow rules, so they still apply
# even though their addresses fall inside the blocked private ranges — a
# NetworkPolicy is the union of its rules, not a sequence of overrides.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kyber.fullname" . }}-agent-egress
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent-isolation
spec:
  podSelector:
    matchExpressions:
      - key: kyber.io/agent
        operator: Exists
  policyTypes:
    - Egress
  egress:
    # Cluster DNS. Without this an agent cannot resolve anything at all.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The control plane. The runtime, the status sidecar and the transcript
    # tailer all call it; per-agent authz on :8082 is the load-bearing control.
    - to:
        - podSelector:
            matchLabels:
              {{- include "kyber.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: control-plane
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
        - protocol: TCP
          port: {{ .Values.api.service.internalPort }}
    # Everything else, minus the infrastructure ranges.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- range .Values.agent.security.egress.blockedCIDRs }}
              - {{ . | quote }}
              {{- end }}
{{- range .Values.agent.security.egress.platformTrustAgents }}
---
# Platform-trust exemption for agent {{ . | quote }}.
#
# kyber#78's non-goal is explicit: intentional host administration must not be
# folded into the normal agent profile. This is that separate tier, and it is
# deliberately noisy — an agent only reaches the infrastructure ranges if an
# operator named it here, in values, where it shows up in every diff and
# render. Rescue agents that hold cluster credentials belong here; nothing
# else does.
#
# NetworkPolicies union, so this restores unrestricted egress for this one
# agent without weakening the default policy above for any other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kyber.fullname" $ }}-agent-egress-platform-{{ . }}
  namespace: {{ include "kyber.namespace" $ }}
  labels:
    {{- include "kyber.labels" $ | nindent 4 }}
    app.kubernetes.io/component: agent-isolation
    kyber.io/trust-tier: platform
spec:
  podSelector:
    matchLabels:
      kyber.io/agent: {{ . | quote }}
  policyTypes:
    - Egress
  egress:
    - {}
{{- end }}
{{- end }}
---
# Internal-API NetworkPolicy (kyber#566, C1 — defense-in-depth).
#
# This is the SECOND of the two controls. The load-bearing control is the
# per-agent authz on :8082 (pkg/api/internal_auth.go). This control-plane policy
# cannot distinguish one agent identity from another because every agent pod
# must reach :8082; the separate agent-default-deny-ingress policy above blocks
# direct connections to agent pods. What this policy adds is attack-surface
# reduction: a compromised NON-agent workload elsewhere in the cluster cannot
# even open a socket to the internal API.
#
# Scope: :8082 only (Matt-locked decision #3 — :8082-scoped, not a broad
# default-deny). Selecting the control-plane pod with a NetworkPolicy would,
# by default-deny semantics, drop ALL ingress not explicitly allowed — so this
# policy ALSO re-admits the public API (http), health, and metrics ports from
# anywhere, leaving them exactly as reachable as before. Only :8082 is tightened.
#
# CAVEAT (delivery-time, Ackbar): two things make this policy inert or wrong if
# unverified — (1) the CNI must actually enforce NetworkPolicy (k3s without its
# NP controller, or GKE without Dataplane V2/Calico, silently no-ops it); and
# (2) the node-agent runs hostNetwork:true, so its traffic to :8082 originates
# from the NODE IP, not a selectable pod — a podSelector can NOT match it. It is
# admitted only via networkPolicy.internalApi.allowedNodeCIDRs below. If that is
# empty AND the CNI enforces this policy, the node-agent's :8082 calls are
# dropped (agent-pod auth still holds). Set the node/pod CIDRs per target and
# verify enforcement empirically. The authz control does not depend on any of
# this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kyber.fullname" . }}-internal-api
  namespace: {{ include "kyber.namespace" . }}
  labels:
    {{- include "kyber.labels" . | nindent 4 }}
    app.kubernetes.io/component: control-plane
spec:
  podSelector:
    matchLabels:
      {{- include "kyber.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
  policyTypes:
    - Ingress
  ingress:
    # (1) Internal API :8082 — sanctioned callers only.
    - from:
        # Every agent pod (its sidecar + session-brief init container call the
        # internal API as the agent's own identity).
        - podSelector:
            matchExpressions:
              - key: kyber.io/agent
                operator: Exists
        {{- range .Values.networkPolicy.internalApi.allowedNodeCIDRs }}
        # Node/pod CIDR(s) — REQUIRED to admit the hostNetwork node-agent (see
        # the CAVEAT above). Operator-supplied per target.
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.internalPort }}
    # (2) Public API (http), health, and metrics — left open from anywhere so
    # this :8082-scoped policy does not silently deny the public API, kubelet
    # health probes, or metrics scraping. The public API has its own auth.
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.api.service.port }}
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: {{ .Values.api.service.metricsPort }}
{{- end }}
