name: codeql

# Static security analysis (CodeQL) over the Go control plane and the
# TypeScript PWA. Code-scanning upload requires a public repo (or GitHub
# Advanced Security), so the job self-skips while the repository is
# private and lights up automatically once it is public.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
