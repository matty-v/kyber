name: release

# Fires on git tag push matching v*.*.*. Builds ALL 8 Kyber images from
# source at the tagged commit (full rebuild — not a manifest copy), pushes
# them as :vX.Y.Z, then creates the GitHub Release.
#
# Why full rebuild instead of re-tagging :<sha> manifests: build.yml uses
# path filters (per kyber CI cost optimization), so not every commit on
# main has all 8 :<sha> manifests in GHCR. Releases need a coherent set
# of 8 images at the tagged commit; that means rebuild-on-tag.
#
# Slower than the manifest-copy approach (~10 min per release vs ~1 min)
# but releases are infrequent — a release is cut deliberately by Dave via
# prepare-release.yml, after Matt approves the version and the notes — so
# the cost is acceptable. See dave-agent/docs/specs/2026-05-25-kyber-release-
# process-design.md and Matt's confirmation 2026-05-25.

on:
  push:
    tags:
      - 'v*.*.*'
  # Manual fallback for the cases where a tag push didn't trigger this
  # workflow (e.g., GitHub Actions outage during the push, like the one
  # at 2026-05-26T10:57Z that left v1.2.0 stalled for hours). Operator
  # runs: `gh workflow run release.yml --ref v1.2.0` (or picks the tag in
  # the Actions UI). The --ref selects the workflow + the meta job's
  # tag resolution via GITHUB_REF_NAME, so no extra input is needed.
  workflow_dispatch: {}

permissions:
  contents: write   # create GitHub Release
  packages: write   # push GHCR tags

env:
  REGISTRY: ghcr.io/matty-v

jobs:
  # A release may only claim A2A support after the pinned contract, official
  # TCK, and independent-client smoke have passed for the tagged commit.
  a2a-conformance:
    uses: ./.github/workflows/a2a-conformance.yml

  # --------------------------------------------------------------------
  # meta: resolve tag + sha + claude-code version (read once, reuse).
  # --------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
      cc_version: ${{ steps.ccver.outputs.version }}
      tag_message: ${{ steps.chainmeta.outputs.tag_message }}
      pwa_version: ${{ steps.chainmeta.outputs.pwa_version }}
      is_test: ${{ steps.chainmeta.outputs.is_test }}
      has_deploy_app: ${{ steps.opsecrets.outputs.has_deploy_app }}
    steps:
      # Optional-integration detection: the post-release chain (pwa-views tag
      # push, deploy-repo bump PRs) is maintainer infrastructure driven by a
      # GitHub App. Forks and fresh clones don't have those secrets — the
      # dependent jobs skip cleanly instead of failing the release. (Secrets
      # are not readable in job-level `if:`, hence this step-level output.)
      - id: opsecrets
        run: |
          echo "has_deploy_app=${{ secrets.KYBER_APP_ID != '' && secrets.KYBER_APP_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.KYBER_APP_ID != '' && secrets.KYBER_APP_PRIVATE_KEY != '' }}" = "false" ]; then
            echo "::notice::KYBER_APP_ID / KYBER_APP_PRIVATE_KEY not configured — the post-release chain jobs (pwa-views publish, deploy bump PRs) will be skipped. The GitHub Release and image pushes are unaffected."
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA=$(git rev-list -n 1 "$TAG")
          # User-facing version: the tag with its leading "v" stripped, matching
          # the bare X.Y.Z users already see. Build-injected into the image as
          # main.Version so the displayed version rides with the code (kyber#482).
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # Match build.yml — claude-code version is pinned in the chart.
      - id: ccver
        run: |
          version=$(yq '.runtime.claudeCode.version' deploy/helm/kyber/values.yaml)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::runtime.claudeCode.version missing or null in deploy/helm/kyber/values.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Outputs for post-release chain jobs (B1 pwa-views publish + B2 deploy bump PR).
      # tag_message: annotated tag body, checked for [skip-publish] opt-out marker.
      # pwa_version: read from packages/pwa-views/package.json.
      # is_test: true when tag contains "-test" — chain jobs dry-run instead of side-effecting.
      - id: chainmeta
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo 'tag_message<<TAGMSGEOF'
            git tag -l --format='%(contents)' "${TAG}" 2>/dev/null || true
            echo TAGMSGEOF
          } >> "$GITHUB_OUTPUT"
          PWA_VERSION=$(node -p "require('./packages/pwa-views/package.json').version")
          echo "pwa_version=${PWA_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *"-test"* ]]; then
            echo "is_test=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_test=false" >> "$GITHUB_OUTPUT"
          fi

  # --------------------------------------------------------------------
  # preflight-check-tags: error fast if any of the 8 kyber-* images
  # already has the target semver tag published on GHCR. Closes the
  # tag-mutability cache-poisoning class of bug (kyber#364) — a
  # re-pushed tag can leave long-lived nodes pinned to the old blob.
  # Bypassed for -test tags so dev iteration can keep re-pushing.
  # --------------------------------------------------------------------
  preflight-check-tags:
    needs: meta
    if: needs.meta.outputs.is_test == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GHCR_PAT }}
      KYBER_TAG: ${{ needs.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - name: Check each kyber-* image
        run: |
          set -e
          for image in kyber-control-plane kyber-node-agent kyber-status-sidecar kyber-mcp-discord kyber-mcp-telegram kyber-runtime-base kyber-claude-code kyber-codex; do
            ./scripts/preflight-tag-not-published.sh "${image}" "${KYBER_TAG}"
          done

  # --------------------------------------------------------------------
  # Build independent leaf images in parallel: control-plane, node-agent,
  # status-sidecar, mcp-discord, and mcp-telegram. Each is a leaf image (no
  # FROM another Kyber image).
  #
  # Every image is published as a linux/amd64 + linux/arm64 manifest list, so
  # an arm64 cluster (an Apple Silicon Mac being the common case — see the macOS
  # install guide, docs/installation-macos.md, added in kyber#73) can run Kyber
  # at all. The per-architecture
  # matrix, the digest merge, and the assertion that a tag really does resolve
  # for both architectures live in the reusable .github/workflows/build-image.yml.
  # --------------------------------------------------------------------
  build-control-plane:
    needs: [meta, preflight-check-tags]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-control-plane
      ref: ${{ needs.meta.outputs.sha }}
      file: images/control-plane/Dockerfile
      cache-scope: control-plane
      tags: ${{ needs.meta.outputs.tag }}
      build-args: |
        BUILD_SHA=${{ needs.meta.outputs.sha }}
        BUILD_DATE=${{ github.event.head_commit.timestamp }}
        BUILD_VERSION=${{ needs.meta.outputs.version }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # kyber#591: refresh the mutable control-plane :latest tag to THIS release's
  # image so a canary tracking :latest via ArgoCD Image Updater reports the
  # clean release label immediately, instead of the stale pre-tag
  # git-describe string baked into whatever :latest build happened to run last
  # (the v2.2.0 bug: razer stuck on 2.1.1-7-gd64fbbd because no canary build
  # ran after the tag). Re-points the tag to the same manifest list just
  # published — no rebuild. Cutting the tag inside release.yml is impossible
  # (it fires ON the tag), so producing :latest here, after the tag exists, is
  # the only place the clean canary label is reachable.
  #
  # 2026-08-10: razer was that canary and no longer is, so this step has no
  # consumer at the moment. KEPT deliberately rather than deleted — a
  # replacement canary is being stood up, and it will want exactly this
  # behaviour. If that plan is abandoned, delete this job; a maintained
  # workflow job with no consumer is worse than an absent one.
  #
  # Guard: only move :latest when the release commit is STILL origin/main HEAD,
  # so a main merge racing the ~10-min release build can never move the canary
  # backward. Skipped for -test tags (must not touch the live canary tag).
  #
  # Its own job since kyber-control-plane moved to the reusable build workflow,
  # which owns its own steps. imagetools create copies the whole manifest list,
  # so :latest is multi-architecture — until the next merge to main, where
  # build.yml republishes an amd64-only :latest. That is fine while every
  # :latest consumer is x86, and it is the reason to move build.yml onto this
  # same reusable workflow the moment one is not.
  refresh-control-plane-latest:
    needs: [meta, build-control-plane]
    if: needs.meta.outputs.is_test == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}
      - name: Refresh control-plane :latest to the release image (guarded)
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_SHA: ${{ needs.meta.outputs.sha }}
        run: |
          set -euo pipefail
          # ls-remote reads origin/main HEAD without needing full local history
          # (the build checkout is shallow at the release sha).
          MAIN_SHA=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ -z "${MAIN_SHA}" ]; then
            echo "::error::could not resolve origin/main HEAD — refusing to move :latest." >&2
            exit 1
          fi
          if [ "${MAIN_SHA}" != "${RELEASE_SHA}" ]; then
            echo ":latest NOT refreshed — release commit ${RELEASE_SHA} is no longer origin/main HEAD (${MAIN_SHA}); skipping to avoid moving the canary backward."
            exit 0
          fi
          echo "Release commit is still origin/main HEAD — refreshing :latest → ${RELEASE_TAG} image (same digests, no rebuild)."
          docker buildx imagetools create \
            --tag "${REGISTRY}/kyber-control-plane:latest" \
            "${REGISTRY}/kyber-control-plane:${RELEASE_TAG}"

  build-node-agent:
    needs: [meta, preflight-check-tags]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-node-agent
      ref: ${{ needs.meta.outputs.sha }}
      file: images/node-agent/Dockerfile
      cache-scope: node-agent
      tags: ${{ needs.meta.outputs.tag }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-status-sidecar:
    needs: [meta, preflight-check-tags]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-status-sidecar
      ref: ${{ needs.meta.outputs.sha }}
      file: images/status-sidecar/Dockerfile
      cache-scope: status-sidecar
      tags: ${{ needs.meta.outputs.tag }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # kyber-mcp-discord (kyber#646): the two-way Discord channel sidecar. Built
  # for every release even though it is injected only into agents that enable
  # spec.channels.discord — an unreleased tag is an unpinnable image, and the
  # deploy-bump below pins it alongside the rest.
  build-mcp-discord:
    needs: [meta, preflight-check-tags]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-mcp-discord
      ref: ${{ needs.meta.outputs.sha }}
      file: images/mcp-discord/Dockerfile
      cache-scope: mcp-discord
      tags: ${{ needs.meta.outputs.tag }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-mcp-telegram:
    needs: [meta, preflight-check-tags]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-mcp-telegram
      ref: ${{ needs.meta.outputs.sha }}
      file: images/mcp-telegram/Dockerfile
      cache-scope: mcp-telegram
      tags: ${{ needs.meta.outputs.tag }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # --------------------------------------------------------------------
  # runtime-base must publish before claude-code so the latter can FROM it.
  # Its tag is a manifest list, so each architecture's claude-code build pulls
  # the matching base without the Dockerfile knowing anything about arches.
  # --------------------------------------------------------------------
  build-runtime-base:
    needs: [meta, preflight-check-tags]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-runtime-base
      ref: ${{ needs.meta.outputs.sha }}
      context: images/agent-base
      cache-scope: runtime-base
      tags: ${{ needs.meta.outputs.tag }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # --------------------------------------------------------------------
  # claude-code FROM runtime-base — wait for the tagged base image to exist.
  # --------------------------------------------------------------------
  build-claude-code:
    needs: [meta, preflight-check-tags, build-runtime-base]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-claude-code
      ref: ${{ needs.meta.outputs.sha }}
      file: images/claude-code/Dockerfile
      cache-scope: claude-code
      tags: ${{ needs.meta.outputs.tag }}
      build-args: |
        BASE_IMAGE=ghcr.io/matty-v/kyber-runtime-base:${{ needs.meta.outputs.tag }}
        CLAUDE_CODE_VERSION=${{ needs.meta.outputs.cc_version }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  build-codex:
    needs: [meta, preflight-check-tags, build-runtime-base]
    uses: ./.github/workflows/build-image.yml
    with:
      image: kyber-codex
      ref: ${{ needs.meta.outputs.sha }}
      file: images/codex/Dockerfile
      cache-scope: codex
      tags: ${{ needs.meta.outputs.tag }}
      build-args: |
        BASE_IMAGE=ghcr.io/matty-v/kyber-runtime-base:${{ needs.meta.outputs.tag }}
    secrets:
      GHCR_PAT: ${{ secrets.GHCR_PAT }}

  # --------------------------------------------------------------------
  # Once all 8 images are pushed: create the GitHub Release.
  # --------------------------------------------------------------------
  release:
    needs: [meta, a2a-conformance, build-control-plane, build-node-agent, build-status-sidecar, build-mcp-discord, build-mcp-telegram, build-runtime-base, build-claude-code, build-codex]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build changelog
        id: changelog
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ needs.meta.outputs.tag }}^" 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            BODY=$(git log --pretty=format:"- %s (%h)" "${PREV}..${{ needs.meta.outputs.tag }}")
          else
            BODY="Initial release"
          fi
          {
            echo 'body<<EOF'
            echo "$BODY"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          make_latest: 'true'

  # --------------------------------------------------------------------
  # B0: Publish the Helm chart as an OCI artifact.
  #
  # Until now the chart was never published anywhere — every ArgoCD Application
  # (razer, falcon, gcp, and Steve's standalone lonestar box) rendered it
  # straight from this git repo at `targetRevision: main`, while pinning image
  # tags to a release. So images were gated and chart TEMPLATES were not: any
  # change merged here reached all four clusters within minutes, ungated, with
  # selfHeal on. Worse, /api/v1/version reports chartVersion from the image's
  # ldflags, so it reported the pinned release while the rendered templates were
  # head-of-main — the version surface lied about the templates.
  #
  # Publishing the chart per release gives every cluster a versioned artifact to
  # pin (`targetRevision: 1.0.1`, or `helm install oci://…`), and is the
  # distribution path the operator-facing update feature needs: a standalone
  # cluster self-upgrades by pulling this artifact. That is why the chart and not
  # just the image tags — the chart carries crds/ and template changes, which
  # patching image tags on a Deployment cannot.
  #
  # Runs after `release` so a chart is only ever published alongside a GitHub
  # Release whose 8 images all built. Idempotent: re-publishing an existing
  # version is skipped, not failed, so the workflow_dispatch re-run path (used
  # during Actions outages) stays usable.
  #
  # TOKEN: GHCR_PAT, not GITHUB_TOKEN — matty-v is a user account and
  # GITHUB_TOKEN cannot write user-owned GHCR packages (same constraint as the
  # image pushes above).
  #
  # NOTE: a newly-created GHCR package is PRIVATE by default. After the first
  # publish, charts/kyber must be flipped to public once, by hand, or operators
  # pulling it get a 401 that reads like a bad chart reference. Same one-time
  # step every kyber-* image package needed.
  # --------------------------------------------------------------------
  publish-chart:
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KYBER_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      # Derived in a step, not job-level `env:` — REGISTRY is a workflow-level
      # env var, which is exported into each step's shell but is NOT resolvable
      # from another `env:` block's expression.
      - name: Resolve chart repository
        run: echo "CHART_REPO=oci://${REGISTRY}/charts" >> "$GITHUB_ENV"

      # The chart version must equal the release version. prepare-release.yml
      # bumps Chart.yaml INSIDE the tagged commit precisely so this holds
      # (kyber#591), and scripts/release-version-guard_test.sh locks it. Assert
      # it here too: publishing a chart labelled differently from the release it
      # ships with would make the artifact unpinnable by version.
      - name: Assert chart version matches the release
        run: |
          CHART_VERSION=$(yq '.version' deploy/helm/kyber/Chart.yaml)
          if [ "$CHART_VERSION" != "$KYBER_VERSION" ]; then
            echo "::error::Chart.yaml version ($CHART_VERSION) != release version ($KYBER_VERSION). prepare-release.yml should have bumped it inside the tagged commit."
            exit 1
          fi
          echo "Chart version $CHART_VERSION matches release $KYBER_VERSION"

      # The three is_test guards below are defensive only — this job cannot
      # currently run for a -test tag at all. `preflight-check-tags` is skipped
      # when is_test is true, every build job `needs` it with no `always()`
      # override, so the whole chain (builds → release → here) skips. Kept so
      # the job stays correct if that ever changes; NOT paired with a "test
      # mode" step, because such a step would be unreachable and would imply
      # test tags are handled here when they never arrive.
      - name: Log in to GHCR
        if: needs.meta.outputs.is_test == 'false'
        run: |
          echo "${{ secrets.GHCR_PAT }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      # Stamp this release's image tags into the chart being packaged.
      #
      # Without this the published artifact cannot install anything: the source
      # values.yaml ships every tag as "" and `kyber.image` uses `required`,
      # which explicitly refuses a Chart.AppVersion fallback (kyber#358/#457 —
      # a silently-wrong tag once deleted running agent pods fleet-wide). So
      # `helm template deploy/helm/kyber` fails today, and so would
      # `helm install oci://…/kyber --version X.Y.Z`.
      #
      # Stamping here rather than defaulting in the template keeps that guard
      # intact for anyone rendering from source, while making the RELEASED
      # artifact self-describing — which is what the pull model needs. A
      # cluster upgrading itself to chart X.Y.Z must get X.Y.Z's images from
      # the chart; if the tags had to come from the operator's values instead,
      # those values would override the new chart and the upgrade would rewrite
      # templates while leaving the old images running.
      #
      # All eight, including the ones the source chart leaves empty on purpose
      # (codex, discordSidecar, telegramSidecar). The release built those
      # images, so the artifact should name them; they stay inert until an
      # agent actually enables that runtime or channel. An operator who wants
      # them off overrides the tag back to "" in their own values.
      #
      # Only the packaged copy is modified — never committed back.
      - name: Stamp release image tags into the chart
        run: |
          set -euo pipefail
          for c in controlPlane nodeAgent agentBase claudeCode codex statusSidecar discordSidecar telegramSidecar; do
            yq -i ".image.${c}.tag = \"v${KYBER_VERSION}\"" deploy/helm/kyber/values.yaml
          done
          echo "Stamped image tags:"
          yq '.image | to_entries | map({"component": .key, "tag": .value.tag})' deploy/helm/kyber/values.yaml

      # Proves the artifact we are about to publish can actually render. This
      # is the check whose absence let an uninstallable chart through: the
      # publish job packaged and pushed without ever templating it.
      - name: Assert the packaged chart renders
        run: helm template kyber deploy/helm/kyber >/dev/null

      - name: Package chart
        run: helm package deploy/helm/kyber --destination dist

      # Idempotency: `helm push` happily overwrites an existing version, which is
      # the same tag-mutability hazard preflight-check-tags guards for images
      # (kyber#364) — a re-pushed chart version leaves clusters that already
      # pulled it on a different artifact under the same name. Skip instead.
      - name: Skip if this chart version is already published
        if: needs.meta.outputs.is_test == 'false'
        id: published
        run: |
          if helm show chart "${CHART_REPO}/kyber" --version "$KYBER_VERSION" >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Chart kyber-${KYBER_VERSION} is already published — skipping push."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push chart to GHCR
        if: needs.meta.outputs.is_test == 'false' && steps.published.outputs.already == 'false'
        run: |
          helm push "dist/kyber-${KYBER_VERSION}.tgz" "${CHART_REPO}"
          echo "::notice::Published ${CHART_REPO}/kyber:${KYBER_VERSION}"

  # --------------------------------------------------------------------
  # B1: Chain-trigger publish-pwa-views.yml by pushing a pwa-views/v* tag.
  # Skipped when: [skip-publish] in tag message, version already on registry,
  # or is_test=true (dry-run only — no tag pushed).
  #
  # NOTE: pushes the tag with a GitHub App token (not GITHUB_TOKEN) because
  # GITHUB_TOKEN pushes do not trigger other workflows (GitHub limitation).
  # Requires kyber-app GitHub App to have contents:write on matty-v/kyber.
  #
  # TOKEN: this MINTS a fresh GitHub App installation token per run via
  # actions/create-github-app-token (from KYBER_APP_ID + KYBER_APP_PRIVATE_KEY
  # secrets). It used to read a STATIC KYBER_APP_TOKEN secret — a GitHub App
  # installation token that expires hourly, so it went stale between the
  # infrequent release runs and the tag-push failed with exit 128 (same
  # stale-token failure mode as auto-publish-pwa-views.yml; see #411 / PR #410,
  # 2026-06-01 — v1.4.0 / v1.3.7 release runs failed on it). Minting fresh each
  # run removes that expiry class of failure entirely.
  # --------------------------------------------------------------------
  publish-pwa-views-chain:
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ !contains(needs.meta.outputs.tag_message, '[skip-publish]') && needs.meta.outputs.has_deploy_app == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.sha }}
          fetch-depth: 0
          # Don't persist the read-only GITHUB_TOKEN as a git auth header — it
          # would override the App-token remote URL the push step sets and the
          # tag push would auth as the contents:read GITHUB_TOKEN → 403.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@matty-v'

      - name: Check whether this pwa-views version should publish
        id: check_published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}
          PWA_VERSION: ${{ needs.meta.outputs.pwa_version }}
        run: |
          # Shared decision with auto-publish-pwa-views.yml: publish only a
          # version strictly newer than the registry's latest. The old
          # version-exact `npm view` check let a release run against an older
          # SHA (re-run, ad-hoc tag) republish a stale unpublished version and
          # move the registry's latest dist-tag BACKWARDS — which bump-holocron
          # would then auto-merge as a downgrade.
          LATEST="$(npm view @matty-v/kyber-pwa-views version 2>/dev/null || echo '')"
          if [ -f scripts/pwa-views-should-tag.sh ]; then
            DECISION="$(bash scripts/pwa-views-should-tag.sh "$PWA_VERSION" "$LATEST")"
          else
            # Release SHA predates the shared script — fall back to the old
            # version-exact check.
            if npm view "@matty-v/kyber-pwa-views@${PWA_VERSION}" version >/dev/null 2>&1; then
              DECISION="skip: ${PWA_VERSION} already published"
            else
              DECISION="tag"
            fi
          fi
          echo "pwa=${PWA_VERSION} published-latest=${LATEST:-<none>} decision=${DECISION}"
          if [ "${DECISION%%[: ]*}" = "tag" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
          else
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      # Mint a fresh per-run App token — gated identically to the push below so
      # a test run (is_test=true) or an already-published version neither mints
      # nor pushes.
      - name: Mint a fresh GitHub App token
        id: app_token
        if: steps.check_published.outputs.already == 'false' && needs.meta.outputs.is_test == 'false'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KYBER_APP_ID }}
          private-key: ${{ secrets.KYBER_APP_PRIVATE_KEY }}
          # default: token scoped to this repo only — exactly what the tag push needs.

      - name: Push pwa-views tag (triggers publish-pwa-views.yml)
        if: steps.check_published.outputs.already == 'false' && needs.meta.outputs.is_test == 'false'
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          PWA_VERSION: ${{ needs.meta.outputs.pwa_version }}
          RELEASE_SHA: ${{ needs.meta.outputs.sha }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Fail loudly if the minted token is somehow empty — a stale/empty
          # token is exactly the silent exit-128 failure this rework fixes.
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::App token is empty — actions/create-github-app-token did not produce a token. Check KYBER_APP_ID / KYBER_APP_PRIVATE_KEY secrets." >&2
            exit 1
          fi
          PVT="pwa-views/v${PWA_VERSION}"
          if git ls-remote --tags origin "refs/tags/${PVT}" | grep -q .; then
            # Tagged but unpublished (the 0.27.3 state). Don't recreate it here
            # — auto-publish-pwa-views.yml owns that recovery (re-tag at main
            # HEAD, current workflow definition); a bare `git tag -a` on an
            # existing tag would just die with exit 128 anyway.
            echo "::warning::${PVT} already exists but ${PWA_VERSION} is not on the registry — its publish likely died after tagging. Recover via auto-publish-pwa-views.yml (workflow_dispatch on main)."
            exit 0
          fi
          git config user.name "kyber-app[bot]"
          git config user.email "kyber-app[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -a "${PVT}" "${RELEASE_SHA}" -m "Release @matty-v/kyber-pwa-views v${PWA_VERSION} (chained from ${RELEASE_TAG})"
          if ! git push origin "${PVT}"; then
            echo "::error::Failed to push ${PVT} — @matty-v/kyber-pwa-views@${PWA_VERSION} will NOT publish and consumers (holocron) will lag. Investigate the App token / push permission immediately." >&2
            exit 1
          fi

      - name: Test mode — tag push skipped
        if: needs.meta.outputs.is_test == 'true'
        env:
          PWA_VERSION: ${{ needs.meta.outputs.pwa_version }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          echo "Test release ${RELEASE_TAG}: not pushing pwa-views/v${PWA_VERSION}."

