  # B2a/B2b (resolve-digests + deploy-bump-pr) REMOVED 2026-08-13.
  #
  # Push delivery has no targets left. razer left ArgoCD on 2026-08-13 and
  # falcon followed the same day; both are now self-updating Helm releases that
  # PULL a chart version an operator chooses. gcp is parked (VM terminated).
  # With an empty matrix these jobs only resolved digests to write into a values
  # file nothing syncs.
  #
  # Leaving them in place was not merely dead weight, it was harmful: a bump PR
  # writes `image.*.tag` pins into environments/<cluster>/values.yaml, and the
  # self-upgrade Job REFUSES to run against values that override image tags
  # (pkg/selfupgrade/values.go PinnedImagePaths). Re-pinning a pulling cluster
  # silently disables its ability to upgrade itself.
  #
  # To put a cluster back on push delivery, restore these jobs from git history
  # (see this commit) AND re-add its ArgoCD Application in matty-v/kyber-deploy.
  # --------------------------------------------------------------------
