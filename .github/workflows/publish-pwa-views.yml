name: Publish @matty-v/kyber-pwa-views

on:
  push:
    tags:
      - 'pwa-views/v*'

permissions:
  contents: read
  packages: write

# Same group as auto-publish-pwa-views.yml: serializes the tag-push decision
# and the publishes themselves, so two quick bumps cannot race two parallel
# `npm publish` runs (last finisher would own the latest dist-tag).
concurrency:
  group: pwa-views-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      has_deploy_app: ${{ steps.creds.outputs.available }}
    steps:
      # Secrets are not readable in job-level `if:` — computed here so the
      # bump-holocron job (a maintainer-private integration) can skip cleanly
      # on forks/fresh clones instead of failing.
      - name: Detect optional App credentials
        id: creds
        run: echo "available=${{ secrets.KYBER_APP_ID != '' && secrets.KYBER_APP_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@matty-v'

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/pwa-views/v}"
          PKG_VERSION="$(node -p "require('./packages/pwa-views/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Install workspace deps
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}

      - name: Build the package
        run: npm run build --workspace=packages/pwa-views

      - name: Run tests
        run: npm run test --workspace=packages/pwa-views

      - name: Publish to GitHub Packages
        working-directory: packages/pwa-views
        run: npm publish
        env:
          # GITHUB_TOKEN cannot write user-owned packages on GitHub Packages
          # (per feedback memory). Use the same PAT used for GHCR image publishes.
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}

  # ---------------------------------------------------------------------------
  # Release-coupled consumer bump: as soon as a new pwa-views version publishes,
  # open (and auto-merge) a PR on Holocron bumping its @matty-v/kyber-pwa-views
  # dependency, so Holocron always tracks the latest release with NO manual step.
  # (Holocron's Dependabot ignores this package to avoid duplicate PRs.)
  # ---------------------------------------------------------------------------
  bump-holocron:
    needs: publish
    runs-on: ubuntu-latest
    # Holocron is the maintainer's private downstream consumer — skip when the
    # GitHub App secrets that drive the bump aren't configured (forks/clones).
    if: needs.publish.outputs.has_deploy_app == 'true'
    steps:
      - name: Compute published version
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/pwa-views/v}" >> "$GITHUB_OUTPUT"

      - name: Mint a GitHub App token scoped to holocron
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KYBER_APP_ID }}
          private-key: ${{ secrets.KYBER_APP_PRIVATE_KEY }}
          owner: matty-v
          repositories: holocron

      - name: Checkout holocron
        uses: actions/checkout@v7
        with:
          repository: matty-v/holocron
          # Persist the App token (which HAS write to holocron) as the git
          # credential — so the branch push below authenticates as the App,
          # not a read-only token (see kyber#420).
          token: ${{ steps.app_token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          # Literal, not node-version-file: this job's checkout is HOLOCRON,
          # so kyber's .nvmrc is not on disk. Keep in sync with .nvmrc.
          node-version: '26'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@matty-v'

      - name: Bump @matty-v/kyber-pwa-views and open an auto-merge PR
        env:
          # GHCR_PAT (read:packages) so `npm install` can resolve the private
          # @matty-v package and update package.json + package-lock.json.
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}
          # App token (PR + contents write on holocron) for gh + the push.
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          CURRENT="$(node -p "require('./package.json').dependencies['@matty-v/kyber-pwa-views'] || ''")"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "holocron already on @matty-v/kyber-pwa-views@${VERSION} — nothing to do"
            exit 0
          fi
          # Never open a DOWNGRADE PR: a stale pwa-views/v* tag pushed from an
          # old clone, or an out-of-order publish, must not walk holocron
          # backwards via an auto-merging PR. Numeric field-wise compare (this
          # job checks out holocron, so kyber's pwa-views-should-tag.sh isn't
          # on disk — keep the ordering rule in sync with that script).
          CUR_CORE="${CURRENT#[\^~]}"; CUR_CORE="${CUR_CORE%%-*}"
          if [ -n "$CUR_CORE" ]; then
            IFS=. read -r c1 c2 c3 <<<"$CUR_CORE"
            IFS=. read -r v1 v2 v3 <<<"${VERSION%%-*}"
            NEWER=false
            for pair in "$v1:$c1" "$v2:$c2" "$v3:$c3"; do
              v="${pair%%:*}"; c="${pair##*:}"
              if [ "$v" -gt "$c" ] 2>/dev/null; then NEWER=true; break; fi
              if [ "$v" -lt "$c" ] 2>/dev/null; then break; fi
            done
            if [ "$NEWER" != "true" ]; then
              echo "::warning::holocron is on ${CURRENT}, refusing to open a bump PR to older/equal ${VERSION}."
              exit 0
            fi
          fi
          BRANCH="auto/pwa-views-${VERSION}"
          if git ls-remote --exit-code --heads origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "branch ${BRANCH} already exists — a bump PR is already open; nothing to do"
            exit 0
          fi
          git config user.name "kyber-app[bot]"
          git config user.email "kyber-app[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          # Pin the exact published version (matches holocron's existing style)
          # and update the lockfile so `npm ci` in CI stays consistent.
          npm install --save-exact "@matty-v/kyber-pwa-views@${VERSION}"
          git add package.json package-lock.json
          git commit -m "chore(deps): bump @matty-v/kyber-pwa-views to ${VERSION}" \
                     -m "Auto-bumped by the kyber pwa-views release (publish-pwa-views.yml) so Holocron always tracks the latest published pwa-views — no manual step (kyber#417 follow-up)."
          git push origin "${BRANCH}"
          PR_URL="$(gh pr create --repo matty-v/holocron --base main --head "${BRANCH}" \
            --title "chore(deps): bump @matty-v/kyber-pwa-views to ${VERSION}" \
            --body "Release-coupled auto-bump from the kyber pwa-views publish. Tracks \`@matty-v/kyber-pwa-views@${VERSION}\`. Auto-merges once CI is green.")"
          echo "opened ${PR_URL}"
          gh pr merge --auto --squash "${PR_URL}" \
            || echo "::warning::could not enable auto-merge on ${PR_URL} — merge it manually"
