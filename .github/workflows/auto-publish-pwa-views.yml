name: Auto-publish pwa-views on version bump

# Closes the "bumped but never published" gap: a version bump to
# packages/pwa-views merged to main (outside a release) used to sit unpublished
# because the pwa-views npm package only publishes on a `pwa-views/v*` tag — and
# that tag was only ever pushed by the release pipeline (release.yml B1) or by
# hand. So a standalone bump (e.g. CI guard forced one, but no release followed)
# never reached the published package, and holocron silently lagged.
#
# This workflow detects a pwa-views version bump on main and pushes the
# `pwa-views/v<version>` tag, which triggers publish-pwa-views.yml. It mirrors
# release.yml's B1 job: idempotent (skips if already on the registry) and pushes
# the tag with a GitHub App token — GITHUB_TOKEN pushes do NOT trigger other
# workflows (GitHub limitation), so the tag would otherwise never fire the
# publish. When a release publishes the same version first, the npm-view check
# here skips cleanly, so there is no double-publish.
#
# TOKEN: this MINTS a fresh GitHub App installation token per run via
# actions/create-github-app-token (from KYBER_APP_ID + KYBER_APP_PRIVATE_KEY
# secrets). It used to read a STATIC KYBER_APP_TOKEN secret, which is a GitHub
# App installation token that expires hourly — so it went stale between runs and
# the tag-push silently failed with exit 128 (observed 2026-06-01: pwa-views
# 0.7.0 bumped on main but never published because the push step failed on a
# stale token, stranding the version and leaving holocron lagging). Minting fresh
# each run removes that expiry class of failure entirely.
on:
  push:
    branches:
      - main
    paths:
      - 'packages/pwa-views/package.json'
  # Manual recovery lever: the paths filter above means a failed run is NOT
  # retried by ordinary main pushes — without this, a stranded bump waits for
  # the next commit that happens to touch package.json.
  workflow_dispatch:

permissions:
  contents: read

# Serialize with the tag-triggered publish: two quick bumps otherwise race two
# parallel publishes, and whichever `npm publish` finishes last owns the
# registry's latest dist-tag — possibly the older version.
concurrency:
  group: pwa-views-publish
  cancel-in-progress: false

jobs:
  publish-on-bump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The auto-publish tag push is maintainer infrastructure (GitHub App +
      # user-owned GitHub Packages). Forks and fresh clones won't have the
      # secrets — skip cleanly instead of failing the run.
      - name: Detect optional App credentials
        id: creds
        run: |
          echo "available=${{ secrets.KYBER_APP_ID != '' && secrets.KYBER_APP_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"
          if [ "${{ secrets.KYBER_APP_ID != '' && secrets.KYBER_APP_PRIVATE_KEY != '' }}" = "false" ]; then
            echo "::notice::KYBER_APP_ID / KYBER_APP_PRIVATE_KEY not configured — skipping the pwa-views auto-publish tag push (fine for forks; the package publish chain is a maintainer integration)."
          fi

      - name: Mint a fresh GitHub App token
        id: app_token
        if: steps.creds.outputs.available == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.KYBER_APP_ID }}
          private-key: ${{ secrets.KYBER_APP_PRIVATE_KEY }}
          # default: token scoped to this repo only — exactly what the tag push needs.

      - uses: actions/checkout@v7
        with:
          # Don't persist the read-only GITHUB_TOKEN as a git auth header — it
          # would override the App-token remote URL the push step sets and the
          # tag push would auth as the contents:read GITHUB_TOKEN → 403.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@matty-v'

      - name: Decide whether this version needs publishing
        id: ver
        env:
          # GHCR_PAT (read:packages) so `npm view` can see the private
          # @matty-v package. Forks/fresh clones won't have it — skip cleanly.
          NODE_AUTH_TOKEN: ${{ secrets.GHCR_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::notice::GHCR_PAT not configured — skipping the pwa-views auto-publish (fine for forks/fresh clones; the publish chain is a maintainer integration)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NEW="$(node -p "require('./packages/pwa-views/package.json').version")"
          # Compare against the REGISTRY's latest, not tags and not HEAD~1.
          # HEAD~1 strands a version superseded between pushes (0.27.2 was
          # never published that way); tags strand a version whose tag pushed
          # but whose publish then died (0.27.3) — the tag exists, the package
          # doesn't, and a tag-based compare reports nothing to do forever.
          # The registry is the only record of what actually went out.
          set +e
          PUBLISHED="$(npm view @matty-v/kyber-pwa-views version 2>npm-err.txt)"
          NPM_RC=$?
          set -e
          if [ $NPM_RC -ne 0 ]; then
            if grep -qi 'E404' npm-err.txt; then
              PUBLISHED=""   # never published — first release
            else
              echo "::error::npm view failed and it is not a 404 — cannot determine the published latest, refusing to guess." >&2
              cat npm-err.txt >&2
              exit 1
            fi
          fi
          DECISION="$(bash scripts/pwa-views-should-tag.sh "$NEW" "$PUBLISHED")"
          echo "new=${NEW} published=${PUBLISHED:-<none>} decision=${DECISION}"
          if [ "${DECISION%%[: ]*}" = "tag" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push pwa-views tag (triggers publish-pwa-views.yml)
        if: steps.creds.outputs.available == 'true' && steps.ver.outputs.changed == 'true'
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          PWA_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Fail loudly if the minted token is somehow empty — a stale/empty
          # token is exactly the silent failure (exit 128) this rework fixes.
          if [ -z "${APP_TOKEN:-}" ]; then
            echo "::error::App token is empty — actions/create-github-app-token did not produce a token. Check KYBER_APP_ID / KYBER_APP_PRIVATE_KEY secrets." >&2
            exit 1
          fi
          PVT="pwa-views/v${PWA_VERSION}"
          if git ls-remote --tags origin "refs/tags/${PVT}" | grep -q .; then
            # We only reach this step when the version is NOT on the registry,
            # so an existing tag means its publish died after tagging — the
            # 0.27.3 state, previously a permanent wedge needing hand surgery.
            # Delete and re-tag at HEAD so the tag-triggered publish re-fires
            # against the CURRENT workflow definition (a tag-triggered run
            # resolves its workflow at the tag's commit, so re-running the old
            # tag would replay whatever bug killed it).
            echo "::warning::${PVT} exists but ${PWA_VERSION} never published — re-tagging at HEAD to re-fire the publish."
            git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
            git push origin ":refs/tags/${PVT}"
          fi
          git config user.name "kyber-app[bot]"
          git config user.email "kyber-app[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${{ github.repository }}.git"
          git tag -a "${PVT}" -m "Auto-publish @matty-v/kyber-pwa-views v${PWA_VERSION} (version bump on main)"
          if ! git push origin "${PVT}"; then
            echo "::error::Failed to push ${PVT} — @matty-v/kyber-pwa-views@${PWA_VERSION} will NOT publish and consumers (holocron) will lag. Investigate the App token / push permission immediately." >&2
            exit 1
          fi
          echo "Pushed ${PVT} — publish-pwa-views.yml will publish @matty-v/kyber-pwa-views@${PWA_VERSION}."
