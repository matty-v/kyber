name: integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'pkg/briefstore/**'
      - 'pkg/messagebuffer/**'
      - 'pkg/api/**'
      - 'test/integration/**'
      - 'test/contract/**'
      # images/claude-code carries the start-claude.sh boot suite (kyber#655).
      # It is tagged `integration` and lives outside test/, so before this entry
      # nothing in CI ran it — the kyber#542 branch-park regression guard sat red
      # for five weeks while two separate PRs broke it.
      - 'images/claude-code/**'
      # kyber#676: the identity-repo half of that boot suite now lives in a
      # shared script. Editing it without this entry would leave the 54-test
      # suite unrun against the change — precisely the gap the comment above
      # describes.
      - 'images/shared/**'
      - '.github/workflows/integration.yml'
  # kyber#360 / #361: fire on every PR targeting main so the
  # regression-arc integration gate is always evaluated before merge.
  # Deliberately NO `paths:` filter on this trigger — a required check
  # that path-filters itself off any given PR leaves the merge gate in
  # an "expected" state forever and blocks the PR (bootstrap deadlock).
  # The push trigger above keeps its narrow path filter so main-branch
  # commits don't run the 15-minute integration suite on unrelated code.
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyber
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kyber
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kyber"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run integration tests
        run: go test -tags integration -v -timeout 15m ./test/integration/... ./test/contract/... ./images/claude-code/... ./images/shared/...
        env:
          KYBER_PG_DSN: postgres://kyber:test@localhost:5433/kyber?sslmode=disable
          KYBER_REDIS_ADDR: localhost:6380
          # The boot suite shells out to start-claude.sh. Git needs an identity for
          # the fixture repos it builds, and the script's own git calls must not
          # inherit the runner's global config.
          GIT_AUTHOR_NAME: kyber-ci
          GIT_AUTHOR_EMAIL: ci@kyber.invalid
          GIT_COMMITTER_NAME: kyber-ci
          GIT_COMMITTER_EMAIL: ci@kyber.invalid
