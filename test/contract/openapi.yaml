openapi: 3.0.3
info:
  title: Kyber Control Plane API
  description: >
    Public HTTP API for the Kyber agent fleet control plane.
    Protected /api/v1/* endpoints accept Bearer authentication or an opaque
    embedded-browser session established from a bearer key.
    Webhook endpoints at /webhooks/* bypass Bearer auth.
  version: 0.1.0

servers:
  - url: http://localhost:8080

security:
  - BearerAuth: []

paths:
  /api/v1/agents/{name}/tasks:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: createAgentTask
      summary: Create a durable agent task
      description: Requires tasks:create and an allowed agent resource.
      tags: [tasks]
      parameters:
        - name: Idempotency-Key
          in: header
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentTask'}
      responses:
        '202':
          description: Durable task created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      operationId: listAgentTasks
      summary: List bounded durable task summaries
      description: Requires tasks:list; returns only tasks owned by the authenticated principal.
      tags: [tasks]
      responses:
        '200':
          description: Durable task page
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items: {$ref: '#/components/schemas/AgentTask'}
                  nextCursor: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /api/v1/agents/{name}/tasks/{taskId}:
    get:
      operationId: getAgentTask
      summary: Get durable task progress and detailed typed results
      description: Requires tasks:read plus tenant, owner, and agent-resource authorization.
      tags: [tasks]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: taskId
          in: path
          required: true
          schema: {type: string, pattern: '^task_[a-f0-9]{32}$'}
      responses:
        '200':
          description: Durable task detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/agents/{name}/tasks/{taskId}/cancel:
    post:
      operationId: cancelAgentTask
      summary: Request cooperative cancellation of a durable task
      description: Requires tasks:cancel and ownership. Cancellation stops future task work but does not roll back prior external effects.
      tags: [tasks]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: taskId
          in: path
          required: true
          schema: {type: string, pattern: '^task_[a-f0-9]{32}$'}
        - name: Idempotency-Key
          in: header
          schema: {type: string, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelAgentTask'}
      responses:
        '200':
          description: Canonical task and cancellation status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTask'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/agents/{name}/tasks/{taskId}/events:
    get:
      operationId: streamAgentTaskEvents
      summary: Replay and follow normalized durable task events
      description: Requires task-events:read plus tenant, owner, and agent-resource authorization. Last-Event-ID and cursor are opaque, signed, and principal-bound.
      tags: [tasks]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string, pattern: '^task_[a-f0-9]{32}$'}}
        - {name: Last-Event-ID, in: header, required: false, schema: {type: string}}
        - {name: cursor, in: query, required: false, schema: {type: string}}
      responses:
        '200':
          description: Resumable Server-Sent Events stream; terminal tasks close after retained replay.
          content:
            text/event-stream:
              schema: {type: string}
        '400': {$ref: '#/components/responses/ValidationError'}
        '404': {$ref: '#/components/responses/NotFound'}
        '410':
          description: Cursor predates the retained event floor; fetch the task snapshot and reconnect with eventCursor.
          content:
            application/json:
              schema:
                type: object
                required: [code, taskId, snapshotRequired, currentCursor]
                properties:
                  code: {type: string, enum: [event_cursor_expired]}
                  taskId: {type: string, pattern: '^task_[a-f0-9]{32}$'}
                  snapshotRequired: {type: boolean, enum: [true]}
                  currentCursor: {type: string}
        '429': {description: Task event connection capacity exceeded}

  /api/v1/agents/{name}/tasks/{taskId}/interactions/{interactionId}/respond:
    post:
      operationId: respondAgentTaskInteraction
      summary: Answer the one outstanding typed task interaction
      description: Requires tasks:continue plus tenant, owner, and agent-resource authorization.
      tags: [tasks]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: taskId, in: path, required: true, schema: {type: string, pattern: '^task_[a-f0-9]{32}$'}}
        - {name: interactionId, in: path, required: true, schema: {type: string, pattern: '^interaction_[a-f0-9]{32}$'}}
        - {name: Idempotency-Key, in: header, schema: {type: string, maxLength: 128}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskInteractionResponse'}
      responses:
        '200': {description: Response accepted and continuation queued, content: {application/json: {schema: {$ref: '#/components/schemas/AgentTask'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /api/v1/agents/{name}/tasks/{taskId}/results/{resultId}/parts/{ordinal}/content:
    get:
      operationId: downloadAgentTaskResultPart
      summary: Download authorized private task-result content
      description: Requires task-results:read plus tenant, owner, and agent-resource authorization.
      tags: [tasks]
      parameters:
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: taskId
          in: path
          required: true
          schema: {type: string, pattern: '^task_[a-f0-9]{32}$'}
        - name: resultId
          in: path
          required: true
          schema: {type: string, pattern: '^result_[a-f0-9]{32}$'}
        - name: ordinal
          in: path
          required: true
          schema: {type: integer, minimum: 0}
        - name: Range
          in: header
          schema: {type: string}
      responses:
        '200':
          description: Complete result file
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Partial result file
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /api/v1/agents/{name}/capabilities:
    get:
      operationId: getAgentCapabilities
      summary: Read the validated operator-curated public capability manifest
      description: Requires capabilities:read plus stable principal, tenant, and exact agent-resource authorization. Private evidence is never returned.
      tags: [agents]
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
        - {name: If-None-Match, in: header, schema: {type: string}}
      responses:
        '200':
          description: Validated public capability manifest and current availability
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentCapabilities'}
        '304': {description: Manifest and availability have not changed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Caller lacks capabilities:read}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {description: Declaration has not reconciled or the agent store is unavailable}

  /api/v1/browser-session:
    post:
      operationId: createBrowserSession
      summary: Exchange a bearer API key for a signed HttpOnly browser session
      tags: [authentication]
      responses:
        '204':
          description: Browser session established
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: Control plane has no shared API key, so it cannot sign sessions

  /api/v1/dev/compute/instances:
    get:
      operationId: listSimulatedComputeInstances
      summary: List explicitly enabled development compute instances
      tags: [development]
      responses:
        '200':
          description: Simulator instances
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimulatedInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/dev/compute/scenarios:
    post:
      operationId: applySimulatedComputeScenario
      summary: Apply an explicitly enabled development compute scenario
      tags: [development]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeScenarioRequest'
      responses:
        '202':
          description: Scenario accepted
        '400':
          description: Scenario rejected
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/config:
    get:
      operationId: getConfig
      summary: Get public provider capabilities and runtime configuration
      tags: [fleet]
      responses:
        '200':
          description: Public installation configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/logging/settings:
    get:
      operationId: getLoggingSettings
      summary: Get desired and effective platform logging settings
      tags: [logging]
      responses:
        '200':
          description: Helm-managed logging settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/logging/targets:
    get:
      operationId: listLoggingTargets
      summary: Discover live and retained Kyber-managed pod/container log targets
      tags: [logging]
      responses:
        '200':
          description: Logging target inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoggingTargets'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/logging/logs:
    get:
      operationId: getLoggingLogs
      summary: Stream live logs from a discovered Kyber-managed container
      description: >
        Streams kubelet or durable archive logs for one pod/container resolved from logging
        discovery. Live reads validate the current pod UID; archive reads validate
        the component/workload/pod UID/container tuple against the bounded retained
        target index. Reads are namespace-bound, concurrency-limited, and tail is
        capped at 10,000 lines.
      tags: [logging]
      parameters:
        - name: pod
          in: query
          required: true
          schema:
            type: string
        - name: podUid
          in: query
          required: true
          schema:
            type: string
        - name: container
          in: query
          required: true
          schema:
            type: string
        - name: component
          in: query
          required: false
          description: Required for archive reads.
          schema: {type: string}
        - name: workload
          in: query
          required: false
          description: Required for archive reads.
          schema: {type: string}
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [kubelet, archive]
            default: kubelet
        - name: since
          in: query
          required: false
          description: Positive Go duration for kubelet; required RFC3339 start for archive.
          schema:
            type: string
        - name: until
          in: query
          required: false
          description: Required RFC3339 end for archive reads.
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 10000
            default: 100
        - name: follow
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: previous
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Plain-text live log stream.
          headers:
            X-Kyber-Log-Truncated:
              schema: {type: string, enum: ['true']}
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/logging/export:
    get:
      operationId: exportLoggingLogs
      summary: Stream a bounded durable log export
      description: >
        Streams one discovered pod/container without buffering the complete
        export in control-plane memory. Windows are capped at 31 days and output
        at 64 MiB by default. A late limit or upstream failure emits a terminal
        marker and the X-Kyber-Log-Truncated trailer.
      tags: [logging]
      parameters:
        - name: pod
          in: query
          required: true
          schema: {type: string}
        - name: podUid
          in: query
          required: true
          schema: {type: string}
        - name: container
          in: query
          required: true
          schema: {type: string}
        - name: component
          in: query
          required: true
          schema: {type: string}
        - name: workload
          in: query
          required: true
          schema: {type: string}
        - name: since
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: until
          in: query
          required: true
          schema: {type: string, format: date-time}
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [ndjson, text]
            default: ndjson
      responses:
        '200':
          description: Streaming attachment.
          headers:
            X-Kyber-Log-Truncated:
              schema: {type: string, enum: ['true']}
          content:
            application/x-ndjson:
              schema: {type: string}
            text/plain:
              schema: {type: string}
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/available:
    get:
      operationId: getAvailableRuntimes
      summary: Get dynamically detected harness versions and models
      tags: [agents]
      responses:
        '200':
          description: Claude and authenticated Codex runtime catalogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/fleet/summary:
    get:
      operationId: getFleetSummary
      summary: Get fleet status summary
      tags: [fleet]
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/fleet-defaults:
    get:
      operationId: getFleetDefaults
      summary: Get runtime-scoped fleet defaults
      tags: [fleet]
      responses:
        '200':
          description: Claude Code and Codex defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDefaults'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateFleetDefaults
      summary: Update runtime-scoped fleet defaults
      tags: [fleet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetDefaultsUpdate'
      responses:
        '200':
          description: Updated defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDefaults'
        '400':
          description: Model id not present in any catalog this cluster can see (pass force to override)
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/machines:
    get:
      operationId: listMachines
      summary: List all machines
      tags: [machines]
      responses:
        '200':
          description: List of machines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMachine
      summary: Create a new machine
      tags: [machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineRequest'
      responses:
        '201':
          description: Machine created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/machines/preflight:
    post:
      operationId: preflightMachine
      summary: Validate and resolve provider-neutral Machine intent without creating capacity
      tags: [machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineRequest'
      responses:
        '200':
          description: Resolved Machine intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachinePreflightResponse'
        '400':
          description: Invalid Machine intent

  /api/v1/machine-candidates:
    get:
      operationId: listMachineCandidates
      summary: List eligible externally managed capacity using opaque candidate IDs
      tags: [machines]
      responses:
        '200':
          description: Eligible capacity candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineCandidatesResponse'
  /api/v1/machines/{name}:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getMachine
      summary: Get a machine by name
      tags: [machines]
      responses:
        '200':
          description: Machine found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMachine
      summary: Delete a machine
      description: >
        Destroys the machine (and its GCE VM / boot disk). Requires the
        confirmation interlock (?confirm={name}) and the lifecycle:admin scope
        (kyber#565). The existing "machine has attached agents" guard (422)
        still applies after the gate.
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/ConfirmName'
      responses:
        '204':
          description: Machine deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List all agents
      tags: [agents]
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAgent
      summary: Create a new agent
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/agents/{name}:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getAgent
      summary: Get an agent by name
      tags: [agents]
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgent
      summary: Delete an agent
      description: >
        Permanently destroys the agent and all of its identity state (PVC,
        agent-scoped secrets, and external-store rows). Requires the
        confirmation interlock (?confirm={name}) and the lifecycle:admin scope
        (kyber#565). Irreversible until off-cluster backups (#171) land.
      tags: [agents]
      parameters:
        - $ref: '#/components/parameters/ConfirmName'
      responses:
        '204':
          description: Agent deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/{name}/repair-runtime:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    post:
      operationId: repairAgentRuntime
      summary: Reinstall and verify a broken agent runtime harness
      description: Requires lifecycle:write and an agent in BrokenRuntime.
      tags: [agents]
      responses:
        '202':
          description: Runtime repaired and agent restart requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeRepairResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/agents/{name}/models:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getAgentModels
      summary: Get the model catalog reported by this authenticated agent
      tags: [agents]
      responses:
        '200':
          description: Provider-visible models for this agent
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableModel'
        '409':
          description: Agent has not reported an authenticated catalog yet
        '503':
          description: Authenticated model catalog storage is unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Agent not found

  /api/v1/agents/{name}/requests:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    post:
      operationId: submitAgentRequest
      summary: Submit a text request to an agent
      description: Requires the requests:write scope.
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAgentRequest'
      responses:
        '202':
          description: Request accepted
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/agents/{name}/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
      - $ref: '#/components/parameters/RequestId'
    get:
      operationId: getAgentRequest
      summary: Read an agent request's status and result
      description: Requires the requests:read scope.
      tags: [agents]
      responses:
        '200':
          description: Request found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/agents/{name}/comms:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: listAgentComms
      summary: List per-agent communication channels and runtime health
      tags: [agents]
      responses:
        '200':
          description: Communication channel configuration and diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/{name}/comms/{channel}:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
      - name: channel
        in: path
        required: true
        schema:
          type: string
          enum: [telegram, discord]
    get:
      operationId: getAgentCommsChannel
      tags: [agents]
      responses:
        '200':
          description: Communication channel configuration and diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommsChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putAgentCommsChannel
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCommsRequest'
      responses:
        '200':
          description: Updated communication channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommsChannel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgentCommsChannel
      tags: [agents]
      responses:
        '204':
          description: Communication channel disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/{name}/codex-device-auth:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getCodexDeviceAuthStatus
      summary: Report what the in-pod Codex device-login flow is showing
      description: >
        Read-only. Returns the verification link, one-time code and expiry
        parsed from the running flow so a client can render them natively.
        "Not ready yet" is a 200 with state=starting, not an error: a pod that
        is still booting and a prompt that has not drawn yet both report
        starting.
      tags: [agents]
      responses:
        '200':
          description: Current state of the device-login flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodexDeviceAuthStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Control plane cannot exec into agent pods
    post:
      operationId: startCodexDeviceAuth
      summary: Start or restart an in-pod Codex device-login flow
      tags: [agents]
      responses:
        '204':
          description: Device login scheduled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/agents/{name}/logs:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getAgentLogs
      summary: Stream or query an agent's logs
      description: >
        Returns an agent's logs as a `text/plain` stream, one line per log line.


        Two sources, selected by the `source` query param:

          * `source=kubelet` (default) — the live kubelet ring-buffer tail. Window
            params are RELATIVE: `since` is a Go duration (e.g. `5m`, `1h`) meaning
            "that long ago". Supports `follow`, `tail`, `previous`, `container`.
            History is bounded by the current pod lifetime — a pod restart evicts it.

          * `source=archive` — the durable, off-cluster surface (kyber#431). Window
            params are ABSOLUTE: `since` and `until` are REQUIRED RFC3339 timestamps
            bounding an inclusive `[since, until]` window. Reads survive pod restarts.
            `follow`, `tail`, `previous`, `container` do not apply. Returns 400 if a
            bound is missing/malformed or if `until` is earlier than `since`; 503 if
            the archive surface is not configured.


        Note the deliberate per-source overload of `since`: a Go duration for
        `kubelet`, an RFC3339 instant for `archive`.
      tags: [agents]
      parameters:
        - name: source
          in: query
          required: false
          description: Log source. `kubelet` (default) is the live tail; `archive` is the durable absolute-window surface.
          schema:
            type: string
            enum: [kubelet, archive]
            default: kubelet
        - name: since
          in: query
          required: false
          description: >
            Window start. For `source=kubelet`, a Go duration ago (e.g. `5m`).
            For `source=archive`, a REQUIRED RFC3339 timestamp (e.g. `2026-06-03T10:00:00Z`).
          schema:
            type: string
            example: 2026-06-03T10:00:00Z
        - name: until
          in: query
          required: false
          description: >
            Window end. Only used (and REQUIRED) when `source=archive`; an RFC3339
            timestamp that must not be earlier than `since`. Ignored for `source=kubelet`.
          schema:
            type: string
            example: 2026-06-03T11:00:00Z
        - name: tail
          in: query
          required: false
          description: Number of lines from the end (`source=kubelet` only). Defaults to 100.
          schema:
            type: integer
            default: 100
        - name: follow
          in: query
          required: false
          description: Stream continuously (`source=kubelet` only).
          schema:
            type: boolean
            default: false
        - name: previous
          in: query
          required: false
          description: Return logs from the previously-terminated container (`source=kubelet` only).
          schema:
            type: boolean
            default: false
        - name: container
          in: query
          required: false
          description: Which container to tail (`source=kubelet` only).
          schema:
            type: string
            enum: [agent, session-brief, kyber-status-sidecar]
            default: agent
      responses:
        '200':
          description: Log stream (one line per log line).
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Archive read failed (upstream object store error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Log surface not available (kubelet clientset or archive reader not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /a2a/v1/agents/{name}/.well-known/agent-card.json:
    parameters:
      - {$ref: '#/components/parameters/A2AAgentName'}
    get:
      operationId: getA2AAgentCard
      summary: Get the authenticated A2A 1.0 Agent Card projection
      tags: [a2a]
      responses:
        '200': {$ref: '#/components/responses/A2AJSON'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /a2a/v1/agents/{name}/message:send:
    parameters:
      - {$ref: '#/components/parameters/A2AAgentName'}
      - {$ref: '#/components/parameters/A2AVersion'}
    post:
      operationId: sendA2AMessage
      summary: Create or continue a native durable task through A2A
      tags: [a2a]
      requestBody: {$ref: '#/components/requestBodies/A2AJSON'}
      responses:
        '200': {$ref: '#/components/responses/A2AJSON'}
        '400': {$ref: '#/components/responses/A2AProblem'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /a2a/v1/agents/{name}/message:stream:
    parameters:
      - {$ref: '#/components/parameters/A2AAgentName'}
      - {$ref: '#/components/parameters/A2AVersion'}
    post:
      operationId: streamA2AMessage
      summary: Create or continue a task and stream native task events
      tags: [a2a]
      requestBody: {$ref: '#/components/requestBodies/A2AJSON'}
      responses:
        '200': {$ref: '#/components/responses/A2AEventStream'}
        '400': {$ref: '#/components/responses/A2AProblem'}

  /a2a/v1/agents/{name}/tasks:
    parameters:
      - {$ref: '#/components/parameters/A2AAgentName'}
      - {$ref: '#/components/parameters/A2AVersion'}
    get:
      operationId: listA2ATasks
      summary: List caller-owned native durable tasks through A2A
      tags: [a2a]
      responses:
        '200': {$ref: '#/components/responses/A2AJSON'}
        '400': {$ref: '#/components/responses/A2AProblem'}

  /a2a/v1/agents/{name}/tasks/{taskId}:
    parameters:
      - {$ref: '#/components/parameters/A2AAgentName'}
      - {$ref: '#/components/parameters/A2AVersion'}
      - name: taskId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getA2ATask
      summary: Get a caller-owned native durable task through A2A
      tags: [a2a]
      responses:
        '200': {$ref: '#/components/responses/A2AJSON'}
        '404': {$ref: '#/components/responses/A2AProblem'}

  /a2a/v1/agents/{name}/tasks/{taskId}:cancel:
    parameters:
      - {$ref: '#/components/parameters/A2AAgentName'}
      - {$ref: '#/components/parameters/A2AVersion'}
      - name: taskId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: cancelA2ATask
      summary: Request cooperative native task cancellation through A2A
      tags: [a2a]
      requestBody: {$ref: '#/components/requestBodies/A2AJSON'}
      responses:
        '200': {$ref: '#/components/responses/A2AJSON'}
        '400': {$ref: '#/components/responses/A2AProblem'}

  /a2a/v1/agents/{name}/tasks/{taskId}:subscribe:
    parameters:
      - {$ref: '#/components/parameters/A2AAgentName'}
      - {$ref: '#/components/parameters/A2AVersion'}
      - name: taskId
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: subscribeA2ATask
      summary: Stream a current snapshot and subsequent native task events
      tags: [a2a]
      responses:
        '200': {$ref: '#/components/responses/A2AEventStream'}
        '404': {$ref: '#/components/responses/A2AProblem'}

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    ResourceName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9\-]{0,61}[a-z0-9]$'
        example: dave

    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        pattern: '^req_[a-f0-9]{32}$'
        example: req_0123456789abcdef0123456789abcdef

    ConfirmName:
      name: confirm
      in: query
      required: true
      description: >
        Confirmation interlock (kyber#565). MUST equal the resource's {name}.
        A missing or mismatched value is rejected with 400 and nothing is
        deleted — guards against an accidental or automated destructive DELETE.
        BREAKING: this parameter is required; pre-#565 callers that omit it now
        receive 400.
      schema:
        type: string
        example: dave

    A2AAgentName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9](?:[a-z0-9\-]{0,61}[a-z0-9])?$'

    A2AVersion:
      name: A2A-Version
      in: header
      required: true
      schema:
        type: string
        enum: ['1.0']

  requestBodies:
    A2AJSON:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

  schemas:
    CodexDeviceAuthStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: >
            absent - no login flow is running; starting - flow is coming up or
            has not printed its prompt yet; ready - a usable code is showing;
            expired - a code was printed but its window has passed; failed -
            Kyber could not read the flow at all and this will not fix itself.
          enum: [absent, starting, ready, expired, failed]
        verificationUrl:
          type: string
          description: Page the operator opens. Absent unless state is ready or expired.
        userCode:
          type: string
          description: One-time code typed into that page. Short-lived and single-use.
        detail:
          type: string
          description: >
            Short operator-facing reason, present only when state is failed.
            Carries the in-pod stderr, bounded; never the pane.
        expiresAt:
          type: string
          format: date-time
          description: >
            When the code stops working, derived from the flow's own relative
            window anchored to the login session's start. Absent when that
            anchor could not be read - a countdown from an unknown origin is
            worse than none.
    ComputeScenarioRequest:
      type: object
      required: [scenario]
      properties:
        machine:
          type: string
        scenario:
          type: string
          enum: [pending, running, stopped, preempted, failed, fail-next-create, fail-next-start, fail-next-stop, fail-next-delete, fail-next-observe]
    SimulatedInstance:
      type: object
      required: [machineName, providerId, observation]
      properties:
        machineName:
          type: string
        providerId:
          type: string
        observation:
          type: object
          additionalProperties: true
        spec:
          type: object
          additionalProperties: true
    DiscordConnection:
      type: object
      required: [status, ready, restartCount]
      properties:
        status:
          type: string
          enum: [not-configured, restart-required, not-running, starting, connected, degraded]
        ready:
          type: boolean
        restartCount:
          type: integer
          format: int32
        detail:
          type: string

    CommsChannel:
      type: object
      required: [channel, configured, podRestartRequired, botTokenSet]
      properties:
        channel:
          type: string
          enum: [telegram, discord]
        configured:
          type: boolean
        podRestartRequired:
          type: boolean
        botTokenSet:
          type: boolean
        guildIds:
          type: array
          items: {type: string}
        channelIds:
          type: array
          items: {type: string}
        allowedUserIds:
          type: array
          items: {type: string}
        mentionOnly:
          type: boolean
        discordConnection:
          $ref: '#/components/schemas/DiscordConnection'

    CommsListResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/CommsChannel'

    PutCommsRequest:
      type: object
      properties:
        botToken:
          type: string
          writeOnly: true
        guildIds:
          type: array
          items: {type: string}
        channelIds:
          type: array
          items: {type: string}
        allowedUserIds:
          type: array
          items: {type: string}
        mentionOnly:
          type: boolean
        action:
          type: string

    FleetDefaults:
      type: object
      required: [defaultModel, defaultRuntimeVersion, codexDefaultModel, codexDefaultRuntimeVersion]
      properties:
        defaultModel:
          type: string
          description: Legacy-compatible Claude Code default model.
        defaultRuntimeVersion:
          type: string
          description: Legacy-compatible Claude Code harness version.
        codexDefaultModel:
          type: string
        codexDefaultRuntimeVersion:
          type: string

    FleetDefaultsUpdate:
      allOf:
        - $ref: '#/components/schemas/FleetDefaults'
        - type: object
          properties:
            force:
              type: boolean
              description: Skip catalog validation of the model ids (write-only; never returned).

    AvailableModel:
      type: object
      required: [id, displayName, contextWindow, contextWindowKnown]
      properties:
        id:
          type: string
        displayName:
          type: string
        contextWindow:
          type: integer
          format: int64
        contextWindowKnown:
          type: boolean

    AvailableResponse:
      type: object
      required: [claudeCodeVersions, codexVersions, models, codexModels]
      properties:
        claudeCodeVersions:
          type: array
          items:
            type: string
        codexVersions:
          type: array
          items:
            type: string
        models:
          type: array
          description: Models detected from the Anthropic API.
          items:
            $ref: '#/components/schemas/AvailableModel'
        codexModels:
          type: array
          description: Picker-visible models reported by authenticated Codex app-server model/list.
          items:
            $ref: '#/components/schemas/AvailableModel'

    FleetSummary:
      type: object
      required: [machineCount, agentCount, agentsByPhase, machinesByPhase]
      properties:
        machineCount:
          type: integer
          description: Total number of machines
          example: 2
        agentCount:
          type: integer
          description: Total number of agents
          example: 5
        agentsByPhase:
          type: object
          description: Agent count grouped by phase
          additionalProperties:
            type: integer
          example:
            Running: 3
            Stopped: 2
        machinesByPhase:
          type: object
          description: Machine count grouped by phase
          additionalProperties:
            type: integer
          example:
            Running: 1
            Ready: 1

    MachineSpec:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [gce, gke, eks, static, fake, mock]
          example: gce
        capacity:
          $ref: '#/components/schemas/MachineCapacity'
        machineType:
          type: string
          description: Managed-provider input. Required for gce/fake; absent for static/mock.
          example: n2-standard-4
        profile:
          type: string
          description: Provider-neutral managed compute profile. Preferred over the deprecated machineType alias.
          example: n2-standard-4
        diskSizeGb:
          type: integer
          format: int32
          minimum: 10
          description: Managed-provider input. Required for gce/fake; absent for static/mock.
          example: 100
        spot:
          type: boolean
          description: Managed-provider input. Absent for static/mock.
          example: false
        zone:
          type: string
          description: Managed-provider input. Required for gce/fake; absent for static/mock.
          example: us-central1-a
        location:
          type: string
          description: Opaque provider location. Preferred over the deprecated zone alias.
          example: us-central1-a
        interruptible:
          type: boolean
          description: Permit provider-initiated reclamation. Preferred over the deprecated spot alias.
        availabilityClass:
          type: string
          enum: [reliable, costOptimized]
        managementMode:
          type: string
          enum: [Managed, External]

    ConfigResponse:
      type: object
      required: [compute, models, identity]
      properties:
        compute:
          type: object
          required: [provider]
          properties:
            provider:
              type: string
              enum: [gce, gke, eks, static, fake, mock, ""]
            managed:
              $ref: '#/components/schemas/ManagedComputeCapabilities'
            gceVMTypes:
              type: array
              deprecated: true
              items:
                $ref: '#/components/schemas/ComputeProfile'
        models:
          type: array
          items:
            type: object
        identity:
          type: object

    LoggingSettings:
      type: object
      required: [globalLevel, componentOverrides, archiveRetentionDays, managedBy]
      properties:
        globalLevel:
          type: string
          enum: [debug, info, warn, error]
        componentOverrides:
          type: object
          additionalProperties:
            type: string
            enum: [debug, info, warn, error]
        archiveRetentionDays:
          type: integer
          minimum: 0
        managedBy:
          type: string
          enum: [helm]

    LoggingTargets:
      type: object
      required: [targets, selector]
      properties:
        selector:
          type: string
        targets:
          type: array
          items:
            $ref: '#/components/schemas/LoggingTarget'

    LoggingTarget:
      type: object
      required: [namespace, pod, podUid, component, workload, phase, sources, liveAvailable, archiveAvailable, containers]
      properties:
        namespace:
          type: string
        pod:
          type: string
        podUid:
          type: string
        component:
          type: string
        workload:
          type: string
        agent:
          type: string
        machine:
          type: string
        phase:
          type: string
        sources:
          type: array
          items:
            type: string
            enum: [kubelet, archive]
        liveAvailable:
          type: boolean
        archiveAvailable:
          type: boolean
        containers:
          type: array
          items:
            $ref: '#/components/schemas/LoggingContainer'

    LoggingContainer:
      type: object
      required: [name, component, effectiveLevel, managedLevel, init]
      properties:
        name:
          type: string
        component:
          type: string
        effectiveLevel:
          type: string
          enum: [debug, info, warn, error, unmanaged]
        managedLevel:
          type: boolean
        init:
          type: boolean

    ManagedComputeCapabilities:
      type: object
      required: [profiles, locations, diskSizesGb, supportsInterruptible]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ComputeProfile'
        locations:
          type: array
          items:
            type: string
        diskSizesGb:
          type: array
          items:
            type: integer
            format: int32
        supportsInterruptible:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/ComputeCapabilities'

    ComputeCapabilities:
      type: object
      required: [canProvision, canDiscoverExisting, suspendMode, deletionMode, supportsReliable, supportsInterruptible, supportsLocations, requiresSchedulerDemand]
      properties:
        canProvision:
          type: boolean
        canDiscoverExisting:
          type: boolean
        suspendMode:
          type: string
          enum: [Capacity, LogicalOnly, Unsupported]
        deletionMode:
          type: string
          enum: [DeleteCapacity, UnregisterOnly]
        supportsReliable:
          type: boolean
        supportsInterruptible:
          type: boolean
        supportsLocations:
          type: boolean
        requiresSchedulerDemand:
          type: boolean

    ComputeProfile:
      type: object
      required: [type, cpu, memory]
      properties:
        type:
          type: string
        cpu:
          type: string
        memory:
          type: string

    MachineCapacity:
      type: object
      required: [cpu, memory]
      description: Declared resource budget. Stamped from machineType on managed providers; user-supplied or detected on static/mock.
      properties:
        cpu:
          type: string
          example: "4"
        memory:
          type: string
          example: "16Gi"

    MachineStatus:
      type: object
      properties:
        phase:
          $ref: '#/components/schemas/MachinePhase'
        message:
          type: string
        instanceId:
          type: string
          deprecated: true
        providerRef:
          type: string
          description: Opaque provider-owned reference. Clients must not parse it.
        availability:
          type: string
          enum: [Pending, Available, Recovering, Offline, Absent, Failed, Unknown]
        resolvedProfile:
          $ref: '#/components/schemas/ResolvedMachineProfile'
        externalIP:
          type: string
        internalIP:
          type: string
        nodeName:
          type: string
        agentCount:
          type: integer
          format: int32

    ResolvedMachineProfile:
      type: object
      required: [id, capacity]
      properties:
        id:
          type: string
        displayName:
          type: string
        description:
          type: string
        capacity:
          $ref: '#/components/schemas/MachineCapacity'

    MachinePhase:
      type: string
      enum:
        - Provisioning
        - Ready
        - Running
        - Stopping
        - Stopped
        - Preempted
        - Replacing
        - Failed
        - Deleted
        - BrokenRuntime
        - ""

    Machine:
      type: object
      required: [id, phase, spec, createdAt]
      properties:
        id:
          type: string
          example: worker-1
        phase:
          $ref: '#/components/schemas/MachinePhase'
        spec:
          $ref: '#/components/schemas/MachineSpec'
        status:
          $ref: '#/components/schemas/MachineStatus'
        createdAt:
          type: string
          format: date-time
          example: "2026-04-10T00:00:00Z"

    MachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Machine'

    CreateMachineRequest:
      type: object
      required: [name, provider]
      description: |-
        Provider-conditional request.
        - provider=gce/fake: machineType, diskSizeGb, zone are required; capacity is rejected (derived server-side).
        - provider=static/mock: capacity may be detected; machineType, diskSizeGb, spot, zone are rejected.
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-]{0,61}[a-z0-9]$'
          example: worker-1
        provider:
          type: string
          enum: [gce, gke, eks, static, fake, mock]
          example: gce
        capacity:
          $ref: '#/components/schemas/MachineCapacity'
        machineType:
          type: string
          example: n2-standard-4
        diskSizeGb:
          type: integer
          format: int32
          minimum: 10
          example: 100
        spot:
          type: boolean
          default: false
          example: false
        zone:
          type: string
          example: us-central1-a
        profile:
          type: string
        location:
          type: string
        interruptible:
          type: boolean
        availabilityClass:
          type: string
          enum: [reliable, costOptimized]
        managementMode:
          type: string
          enum: [Managed, External]

    MachinePreflightResponse:
      type: object
      required: [valid, resolved, warnings]
      properties:
        valid:
          type: boolean
        resolved:
          type: object
          required: [provider, managementMode]
          properties:
            provider:
              type: string
            profile:
              type: string
            availabilityClass:
              type: string
              enum: [reliable, costOptimized]
            location:
              type: string
            managementMode:
              type: string
              enum: [Managed, External]
            diskSizeGb:
              type: integer
              format: int32
            capacity:
              $ref: '#/components/schemas/MachineCapacity'
        warnings:
          type: array
          items:
            type: string

    MachineCandidatesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MachineCandidate'

    MachineCandidate:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Opaque candidate identifier; clients must not parse it.
        displayName:
          type: string
        location:
          type: string
        capacity:
          $ref: '#/components/schemas/MachineCapacity'

    AgentPhase:
      type: string
      enum:
        - Creating
        - Starting
        - Running
        - Stopping
        - Stopped
        - Restarting
        - Failed
        - Deleted
        - ""

    AgentResources:
      type: object
      required: [cpu, memory, disk]
      properties:
        cpu:
          type: string
          example: "1"
        memory:
          type: string
          example: 2Gi
        disk:
          type: string
          example: 50Gi

    AgentStatus:
      type: object
      properties:
        phase:
          $ref: '#/components/schemas/AgentPhase'
        podName:
          type: string
        podIP:
          type: string
        restartCount:
          type: integer
          format: int32
        message:
          type: string

    AgentResourceUsage:
      type: object
      required: [sampledAt, cpuUsageCores, memoryUsedBytes, diskUsedBytes, diskTotalBytes, diskLimitEnforced, diskReserveReached]
      properties:
        sampledAt:
          type: string
          format: date-time
        cpuUsageCores:
          type: number
          format: double
        cpuLimitCores:
          type: number
          format: double
        memoryUsedBytes:
          type: integer
          format: int64
        memoryLimitBytes:
          type: integer
          format: int64
        diskUsedBytes:
          type: integer
          format: int64
        diskTotalBytes:
          type: integer
          format: int64
        diskLimitEnforced:
          type: boolean
        diskBackingTotalBytes:
          type: integer
          format: int64
        diskBackingAvailableBytes:
          type: integer
          format: int64
        diskReserveReached:
          type: boolean
        diskUsageMethod:
          type: string
          enum: [statfs, directory]
        diskUsageState:
          type: string
          enum: [pending, ready, partial, error]
        diskUsedSampledAt:
          type: string
          format: date-time

    AgentActivityStatus:
      type: object
      properties:
        lastHeartbeatAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [working, idle, unknown]
        lastActivityAt:
          type: string
          format: date-time
        resources:
          $ref: '#/components/schemas/AgentResourceUsage'

    Agent:
      type: object
      required: [id, phase, machine, runtime, authType, model, resources, createdAt]
      properties:
        id:
          type: string
          example: dave
        phase:
          $ref: '#/components/schemas/AgentPhase'
        machine:
          type: string
          example: worker-1
        runtime:
          type: string
          example: claude-code
        authType:
          type: string
          enum: [oauth, api-key]
        model:
          type: string
          example: claude-sonnet-4
        startupPrompt:
          type: string
          maxLength: 32768
          description: Initial user turn delivered whenever a new harness session starts.
        sessionResume:
          type: boolean
          description: Resume the previous harness session after an unexpected session end (pod recreate, preemption, crash). Intentional session restarts always start fresh.
        requestReplyEnabled:
          type: boolean
          description: Allow authenticated callers with request scopes to submit bounded requests to this agent. Defaults to false.
        a2aPeers:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/AgentA2APeer'
        publicCapabilities:
          $ref: '#/components/schemas/PublicCapabilitiesDeclaration'
        publicCapabilitiesStatus:
          $ref: '#/components/schemas/PublicCapabilitiesStatus'
        currentModel:
          type: string
          description: Concrete model observed from the running runtime; populated after its first response when the harness chooses the default.
        resources:
          $ref: '#/components/schemas/AgentResources'
        status:
          $ref: '#/components/schemas/AgentStatus'
        activity:
          $ref: '#/components/schemas/AgentActivityStatus'
        createdAt:
          type: string
          format: date-time
          example: "2026-04-10T00:00:00Z"

    PublicCapabilityIdentity:
      type: object
      required: [displayName, description]
      properties:
        displayName: {type: string, maxLength: 128}
        description: {type: string, maxLength: 1024}
        documentationUrl: {type: string, format: uri, maxLength: 2048}

    AgentA2APeer:
      type: object
      required: [name, url, credential]
      properties:
        name:
          type: string
          maxLength: 63
          pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
        url:
          type: string
          maxLength: 2048
          pattern: '^https://[^[:space:]]+$'
        credential:
          type: object
          required: [existingSecret, key]
          properties:
            existingSecret:
              type: string
              maxLength: 253
              pattern: '^[a-z0-9](?:[-a-z0-9]*[a-z0-9])?$'
            key:
              type: string
              minLength: 1
              maxLength: 253
        allowPrivateNetwork:
          type: boolean

    PublicCapabilityEvidence:
      type: object
      description: Operator-only evidence requirements; never included in AgentCapabilities.
      properties:
        requiredSkills: {type: array, maxItems: 16, items: {type: string}}
        requiredConnectors: {type: array, maxItems: 16, items: {type: string}}
        requiredPlatformFeatures: {type: array, maxItems: 16, items: {type: string}}
        runtimeAdapters: {type: array, maxItems: 8, items: {type: string}}

    PublicCapabilityDeclarationItem:
      type: object
      required: [id, version, name, description, inputModes, outputModes]
      properties:
        id: {type: string, pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'}
        version: {type: string, maxLength: 64}
        name: {type: string, maxLength: 128}
        description: {type: string, maxLength: 1024}
        inputModes: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
        outputModes: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
        taskFeatures: {type: array, maxItems: 16, items: {type: string}}
        evidence: {$ref: '#/components/schemas/PublicCapabilityEvidence'}

    PublicCapabilitiesDeclaration:
      type: object
      required: [schemaVersion, identity]
      properties:
        schemaVersion: {type: string, enum: [v1alpha1]}
        identity: {$ref: '#/components/schemas/PublicCapabilityIdentity'}
        capabilities:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PublicCapabilityDeclarationItem'}

    PublicCapabilitiesStatus:
      type: object
      properties:
        observedGeneration: {type: integer, format: int64}
        manifestRevision: {type: string}
        observedAt: {type: string, format: date-time}
        capabilities:
          type: array
          items:
            type: object
            required: [id, availability]
            properties:
              id: {type: string}
              availability: {type: string, enum: [available, degraded, unavailable, unknown]}
              reason: {type: string}

    AgentCapabilities:
      type: object
      required: [schemaVersion, agentResourceId, revision, generatedAt, identity, capabilities]
      properties:
        schemaVersion: {type: string, enum: [v1alpha1]}
        agentResourceId: {type: string}
        revision: {type: string}
        generatedAt: {type: string, format: date-time}
        identity: {$ref: '#/components/schemas/PublicCapabilityIdentity'}
        capabilities:
          type: array
          items:
            type: object
            required: [id, version, name, description, inputModes, outputModes, availability]
            properties:
              id: {type: string}
              version: {type: string}
              name: {type: string}
              description: {type: string}
              inputModes: {type: array, items: {type: string}}
              outputModes: {type: array, items: {type: string}}
              taskFeatures: {type: array, items: {type: string}}
              availability: {type: string, enum: [available, degraded, unavailable, unknown]}
              reason: {type: string}

    RuntimeRepairResponse:
      type: object
      required: [agent, runtime, message, output]
      properties:
        agent:
          type: string
        runtime:
          type: string
        message:
          type: string
        output:
          type: string

    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    CreateAgentRequest:
      type: object
      required: [name, machine, runtime]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-]{0,61}[a-z0-9]$'
          example: dave
        machine:
          type: string
          example: worker-1
        runtime:
          type: string
          example: claude-code
        model:
          type: string
          example: claude-sonnet-4
        startupPrompt:
          type: string
          maxLength: 32768
          description: Initial user turn delivered whenever a new harness session starts.
        sessionResume:
          type: boolean
          description: Resume the previous harness session after an unexpected session end (pod recreate, preemption, crash). Intentional session restarts always start fresh.
        requestReplyEnabled:
          type: boolean
          description: Allow authenticated callers with request scopes to submit bounded requests to this agent. Defaults to false.
        a2aPeers:
          type: array
          maxItems: 16
          items:
            $ref: '#/components/schemas/AgentA2APeer'
        force:
          type: boolean
          description: Skip catalog validation of the model id (write-only).
        resources:
          type: object
          properties:
            cpu:
              type: string
              example: "1"
            memory:
              type: string
              example: 2Gi
            disk:
              type: string
              example: 50Gi
        identity:
          type: object
          properties:
            soulDescription:
              type: string
        secrets:
          type: object
          properties:
            telegramEnabled:
              type: boolean
              default: false
            telegramBotToken:
              type: string
              writeOnly: true
            telegramAllowedUserIds:
              type: array
              items:
                type: string
            anthropicKey:
              type: string
            openaiApiKey:
              type: string
              writeOnly: true
            codexAuthJson:
              type: string
              description: Opaque auth.json from Codex ChatGPT login; write-only.
            authType:
              type: string
              enum: [oauth, api-key]
              default: oauth

    SubmitAgentRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          description: UTF-8 text prompt, limited by the configured byte limit.
        correlation:
          type: string
          description: Optional caller correlation value, limited by the configured byte limit.

    CreateAgentTask:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt: {type: string}
        correlation: {type: string}
        deadlineAt: {type: string, format: date-time}

    CancelAgentTask:
      type: object
      additionalProperties: false
      properties:
        reason: {type: string, maxLength: 2048}

    AgentTaskCancellation:
      type: object
      required: [requestedAt, requestedBy, deadlineAt, status, scope, applied]
      properties:
        requestedAt: {type: string, format: date-time}
        requestedBy: {type: string}
        reason: {type: string}
        deadlineAt: {type: string, format: date-time}
        acknowledgedAt: {type: string, format: date-time}
        ackSource: {type: string}
        status: {type: string, enum: [requested, acknowledged]}
        scope: {type: string, enum: [future_task_work]}
        applied: {type: boolean}

    AgentTaskProgress:
      type: object
      required: [message, updatedAt]
      properties:
        message: {type: string}
        percent: {type: integer, minimum: 0, maximum: 100}
        updatedAt: {type: string, format: date-time}

    TaskInteractionResponse:
      type: object
      required: [response]
      additionalProperties: false
      properties:
        response: {}

    AgentTaskInteraction:
      type: object
      required: [id, attemptId, type, status, question, createdAt, expiresAt]
      properties:
        id: {type: string, pattern: '^interaction_[a-f0-9]{32}$'}
        attemptId: {type: string, pattern: '^attempt_[a-f0-9]{32}$'}
        type: {type: string, enum: [text, choice, confirm, json, authorization]}
        status: {type: string, enum: [paused, answered, consumed, expired]}
        question: {type: string}
        options: {type: array, items: {type: object, required: [id, label], properties: {id: {type: string}, label: {type: string}}}}
        schema: {type: object}
        authorizationFlow: {type: string}
        response: {}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        answeredAt: {type: string, format: date-time}

    AgentTaskMessage:
      type: object
      required: [sequence, role, kind, createdAt]
      properties:
        sequence: {type: integer, format: int64}
        role: {type: string, enum: [caller, agent, platform]}
        kind: {type: string}
        text: {type: string}
        data: {}
        createdAt: {type: string, format: date-time}

    AgentTaskFile:
      type: object
      required: [filename, mediaType, size, sha256, scanStatus, downloadPath]
      properties:
        filename: {type: string}
        mediaType: {type: string}
        size: {type: integer, format: int64, minimum: 0}
        sha256: {type: string}
        scanStatus: {type: string}
        downloadPath: {type: string}

    AgentTaskPart:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [text, json, file]}
        value: {}
        file: {$ref: '#/components/schemas/AgentTaskFile'}

    AgentTaskResult:
      type: object
      required: [id, name, partCount, totalBytes, createdAt]
      properties:
        id: {type: string, pattern: '^result_[a-f0-9]{32}$'}
        name: {type: string}
        description: {type: string}
        parts:
          type: array
          items: {$ref: '#/components/schemas/AgentTaskPart'}
        partKinds:
          type: array
          items: {type: string, enum: [text, json, file]}
        partCount: {type: integer, minimum: 0}
        totalBytes: {type: integer, format: int64, minimum: 0}
        createdAt: {type: string, format: date-time}

    AgentTask:
      type: object
      required: [id, agent, state, version, createdAt, updatedAt, deadlineAt, retainUntil]
      properties:
        id: {type: string, pattern: '^task_[a-f0-9]{32}$'}
        agent: {type: string}
        state: {type: string, enum: [queued, dispatched, input_required, auth_required, canceling, canceled, completed, failed, rejected]}
        failureCode: {type: string}
        error: {type: string}
        correlation: {type: string}
        response: {type: string}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        deadlineAt: {type: string, format: date-time}
        retainUntil: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        progress: {$ref: '#/components/schemas/AgentTaskProgress'}
        cancel: {$ref: '#/components/schemas/AgentTaskCancellation'}
        interaction: {$ref: '#/components/schemas/AgentTaskInteraction'}
        messages: {type: array, items: {$ref: '#/components/schemas/AgentTaskMessage'}}
        eventCursor:
          type: string
          description: Opaque signed cursor at the snapshot's event high-water mark.
        results:
          type: array
          items: {$ref: '#/components/schemas/AgentTaskResult'}

    AgentRequest:
      type: object
      required: [id, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          pattern: '^req_[a-f0-9]{32}$'
        status:
          type: string
          enum: [queued, dispatched, completed, failed, expired]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        response:
          type: string
          description: Present only for completed requests.
        error:
          type: string
          description: Stable failure code, present only for failed requests.

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: name is required
        field:
          type: string
          example: name

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

  responses:
    A2AJSON:
      description: A2A 1.0 HTTP+JSON response defined by the pinned protocol SDK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true

    A2AEventStream:
      description: A2A 1.0 server-sent event stream
      content:
        text/event-stream:
          schema: {type: string}

    A2AProblem:
      description: A2A 1.0 protocol error
      content:
        application/problem+json:
          schema:
            type: object
            additionalProperties: true
        application/json:
          schema:
            type: object
            additionalProperties: true

    InternalError:
      description: Internal operation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ValidationError:
      description: Bad request — validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: >
        Authenticated but not authorized — the caller's API key lacks the scope
        this verb requires (kyber#474/#565). The body is intentionally non-leaky
        (it names neither the required scope nor the caller's granted scopes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Request is valid but cannot be processed (e.g. machine has attached agents)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Per-caller concurrency or per-agent outstanding-request limit reached
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    BadGateway:
      description: Upstream log source failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: Required backend service is unavailable or not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotImplemented:
      description: This operation is not supported for the selected runtime
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    PayloadTooLarge:
      description: Request body or one of its fields exceeds the configured byte limit
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
