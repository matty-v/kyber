openapi: 3.0.3
info:
  title: Kyber Control Plane API
  description: >
    Public HTTP API for the Kyber agent fleet control plane.
    Protected /api/v1/* endpoints accept Bearer authentication or an opaque
    embedded-browser session established from a bearer key.
    Webhook endpoints at /webhooks/* bypass Bearer auth.
  version: 0.1.0

servers:
  - url: http://localhost:8080

security:
  - BearerAuth: []

paths:
  /api/v1/browser-session:
    post:
      operationId: createBrowserSession
      summary: Exchange a bearer API key for an opaque HttpOnly browser session
      tags: [authentication]
      responses:
        '204':
          description: Browser session established
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/dev/compute/instances:
    get:
      operationId: listSimulatedComputeInstances
      summary: List explicitly enabled development compute instances
      tags: [development]
      responses:
        '200':
          description: Simulator instances
          content:
            application/json:
              schema:
                type: object
                required: [instances]
                properties:
                  instances:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimulatedInstance'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/dev/compute/scenarios:
    post:
      operationId: applySimulatedComputeScenario
      summary: Apply an explicitly enabled development compute scenario
      tags: [development]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputeScenarioRequest'
      responses:
        '202':
          description: Scenario accepted
        '400':
          description: Scenario rejected
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/config:
    get:
      operationId: getConfig
      summary: Get public provider capabilities and runtime configuration
      tags: [fleet]
      responses:
        '200':
          description: Public installation configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/available:
    get:
      operationId: getAvailableRuntimes
      summary: Get dynamically detected harness versions and models
      tags: [agents]
      responses:
        '200':
          description: Claude and authenticated Codex runtime catalogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/fleet/summary:
    get:
      operationId: getFleetSummary
      summary: Get fleet status summary
      tags: [fleet]
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/fleet-defaults:
    get:
      operationId: getFleetDefaults
      summary: Get runtime-scoped fleet defaults
      tags: [fleet]
      responses:
        '200':
          description: Claude Code and Codex defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDefaults'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateFleetDefaults
      summary: Update runtime-scoped fleet defaults
      tags: [fleet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FleetDefaults'
      responses:
        '200':
          description: Updated defaults
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetDefaults'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/machines:
    get:
      operationId: listMachines
      summary: List all machines
      tags: [machines]
      responses:
        '200':
          description: List of machines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createMachine
      summary: Create a new machine
      tags: [machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineRequest'
      responses:
        '201':
          description: Machine created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/machines/preflight:
    post:
      operationId: preflightMachine
      summary: Validate and resolve provider-neutral Machine intent without creating capacity
      tags: [machines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineRequest'
      responses:
        '200':
          description: Resolved Machine intent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachinePreflightResponse'
        '400':
          description: Invalid Machine intent

  /api/v1/machine-candidates:
    get:
      operationId: listMachineCandidates
      summary: List eligible externally managed capacity using opaque candidate IDs
      tags: [machines]
      responses:
        '200':
          description: Eligible capacity candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineCandidatesResponse'
  /api/v1/machines/{name}:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getMachine
      summary: Get a machine by name
      tags: [machines]
      responses:
        '200':
          description: Machine found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteMachine
      summary: Delete a machine
      description: >
        Destroys the machine (and its GCE VM / boot disk). Requires the
        confirmation interlock (?confirm={name}) and the lifecycle:admin scope
        (kyber#565). The existing "machine has attached agents" guard (422)
        still applies after the gate.
      tags: [machines]
      parameters:
        - $ref: '#/components/parameters/ConfirmName'
      responses:
        '204':
          description: Machine deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/agents:
    get:
      operationId: listAgents
      summary: List all agents
      tags: [agents]
      responses:
        '200':
          description: List of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createAgent
      summary: Create a new agent
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/agents/{name}:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getAgent
      summary: Get an agent by name
      tags: [agents]
      responses:
        '200':
          description: Agent found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgent
      summary: Delete an agent
      description: >
        Permanently destroys the agent and all of its identity state (PVC,
        agent-scoped secrets, and external-store rows). Requires the
        confirmation interlock (?confirm={name}) and the lifecycle:admin scope
        (kyber#565). Irreversible until off-cluster backups (#171) land.
      tags: [agents]
      parameters:
        - $ref: '#/components/parameters/ConfirmName'
      responses:
        '204':
          description: Agent deleted
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/{name}/models:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getAgentModels
      summary: Get the model catalog reported by this authenticated agent
      tags: [agents]
      responses:
        '200':
          description: Provider-visible models for this agent
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/AvailableModel'
        '409':
          description: Agent has not reported an authenticated catalog yet
        '503':
          description: Authenticated model catalog storage is unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Agent not found

  /api/v1/agents/{name}/comms:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: listAgentComms
      summary: List per-agent communication channels and runtime health
      tags: [agents]
      responses:
        '200':
          description: Communication channel configuration and diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommsListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/{name}/comms/{channel}:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
      - name: channel
        in: path
        required: true
        schema:
          type: string
          enum: [telegram, discord]
    get:
      operationId: getAgentCommsChannel
      tags: [agents]
      responses:
        '200':
          description: Communication channel configuration and diagnostics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommsChannel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: putAgentCommsChannel
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutCommsRequest'
      responses:
        '200':
          description: Updated communication channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommsChannel'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAgentCommsChannel
      tags: [agents]
      responses:
        '204':
          description: Communication channel disabled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/agents/{name}/codex-device-auth:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    post:
      operationId: startCodexDeviceAuth
      summary: Start or restart an in-pod Codex device-login flow
      tags: [agents]
      responses:
        '204':
          description: Device login scheduled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/agents/{name}/logs:
    parameters:
      - $ref: '#/components/parameters/ResourceName'
    get:
      operationId: getAgentLogs
      summary: Stream or query an agent's logs
      description: >
        Returns an agent's logs as a `text/plain` stream, one line per log line.


        Two sources, selected by the `source` query param:

          * `source=kubelet` (default) — the live kubelet ring-buffer tail. Window
            params are RELATIVE: `since` is a Go duration (e.g. `5m`, `1h`) meaning
            "that long ago". Supports `follow`, `tail`, `previous`, `container`.
            History is bounded by the current pod lifetime — a pod restart evicts it.

          * `source=archive` — the durable, off-cluster surface (kyber#431). Window
            params are ABSOLUTE: `since` and `until` are REQUIRED RFC3339 timestamps
            bounding an inclusive `[since, until]` window. Reads survive pod restarts.
            `follow`, `tail`, `previous`, `container` do not apply. Returns 400 if a
            bound is missing/malformed or if `until` is earlier than `since`; 503 if
            the archive surface is not configured.


        Note the deliberate per-source overload of `since`: a Go duration for
        `kubelet`, an RFC3339 instant for `archive`.
      tags: [agents]
      parameters:
        - name: source
          in: query
          required: false
          description: Log source. `kubelet` (default) is the live tail; `archive` is the durable absolute-window surface.
          schema:
            type: string
            enum: [kubelet, archive]
            default: kubelet
        - name: since
          in: query
          required: false
          description: >
            Window start. For `source=kubelet`, a Go duration ago (e.g. `5m`).
            For `source=archive`, a REQUIRED RFC3339 timestamp (e.g. `2026-06-03T10:00:00Z`).
          schema:
            type: string
            example: 2026-06-03T10:00:00Z
        - name: until
          in: query
          required: false
          description: >
            Window end. Only used (and REQUIRED) when `source=archive`; an RFC3339
            timestamp that must not be earlier than `since`. Ignored for `source=kubelet`.
          schema:
            type: string
            example: 2026-06-03T11:00:00Z
        - name: tail
          in: query
          required: false
          description: Number of lines from the end (`source=kubelet` only). Defaults to 100.
          schema:
            type: integer
            default: 100
        - name: follow
          in: query
          required: false
          description: Stream continuously (`source=kubelet` only).
          schema:
            type: boolean
            default: false
        - name: previous
          in: query
          required: false
          description: Return logs from the previously-terminated container (`source=kubelet` only).
          schema:
            type: boolean
            default: false
        - name: container
          in: query
          required: false
          description: Which container to tail (`source=kubelet` only).
          schema:
            type: string
            enum: [agent, session-brief, kyber-status-sidecar]
            default: agent
      responses:
        '200':
          description: Log stream (one line per log line).
          content:
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: Archive read failed (upstream object store error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Log surface not available (kubelet clientset or archive reader not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  parameters:
    ResourceName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9][a-z0-9\-]{0,61}[a-z0-9]$'
        example: dave

    ConfirmName:
      name: confirm
      in: query
      required: true
      description: >
        Confirmation interlock (kyber#565). MUST equal the resource's {name}.
        A missing or mismatched value is rejected with 400 and nothing is
        deleted — guards against an accidental or automated destructive DELETE.
        BREAKING: this parameter is required; pre-#565 callers that omit it now
        receive 400.
      schema:
        type: string
        example: dave

  schemas:
    ComputeScenarioRequest:
      type: object
      required: [scenario]
      properties:
        machine:
          type: string
        scenario:
          type: string
          enum: [pending, running, stopped, preempted, failed, fail-next-create, fail-next-start, fail-next-stop, fail-next-delete, fail-next-observe]
    SimulatedInstance:
      type: object
      required: [machineName, providerId, observation]
      properties:
        machineName:
          type: string
        providerId:
          type: string
        observation:
          type: object
          additionalProperties: true
        spec:
          type: object
          additionalProperties: true
    DiscordConnection:
      type: object
      required: [status, ready, restartCount]
      properties:
        status:
          type: string
          enum: [not-configured, restart-required, not-running, starting, connected, degraded]
        ready:
          type: boolean
        restartCount:
          type: integer
          format: int32
        detail:
          type: string

    CommsChannel:
      type: object
      required: [channel, configured, podRestartRequired, botTokenSet]
      properties:
        channel:
          type: string
          enum: [telegram, discord]
        configured:
          type: boolean
        podRestartRequired:
          type: boolean
        botTokenSet:
          type: boolean
        guildIds:
          type: array
          items: {type: string}
        channelIds:
          type: array
          items: {type: string}
        allowedUserIds:
          type: array
          items: {type: string}
        mentionOnly:
          type: boolean
        discordConnection:
          $ref: '#/components/schemas/DiscordConnection'

    CommsListResponse:
      type: object
      required: [channels]
      properties:
        channels:
          type: array
          items:
            $ref: '#/components/schemas/CommsChannel'

    PutCommsRequest:
      type: object
      properties:
        botToken:
          type: string
          writeOnly: true
        guildIds:
          type: array
          items: {type: string}
        channelIds:
          type: array
          items: {type: string}
        allowedUserIds:
          type: array
          items: {type: string}
        mentionOnly:
          type: boolean
        action:
          type: string

    FleetDefaults:
      type: object
      required: [defaultModel, defaultRuntimeVersion, codexDefaultModel, codexDefaultRuntimeVersion]
      properties:
        defaultModel:
          type: string
          description: Legacy-compatible Claude Code default model.
        defaultRuntimeVersion:
          type: string
          description: Legacy-compatible Claude Code harness version.
        codexDefaultModel:
          type: string
        codexDefaultRuntimeVersion:
          type: string

    AvailableModel:
      type: object
      required: [id, displayName, contextWindow, contextWindowKnown]
      properties:
        id:
          type: string
        displayName:
          type: string
        contextWindow:
          type: integer
          format: int64
        contextWindowKnown:
          type: boolean

    AvailableResponse:
      type: object
      required: [claudeCodeVersions, codexVersions, models, codexModels]
      properties:
        claudeCodeVersions:
          type: array
          items:
            type: string
        codexVersions:
          type: array
          items:
            type: string
        models:
          type: array
          description: Models detected from the Anthropic API.
          items:
            $ref: '#/components/schemas/AvailableModel'
        codexModels:
          type: array
          description: Picker-visible models reported by authenticated Codex app-server model/list.
          items:
            $ref: '#/components/schemas/AvailableModel'

    FleetSummary:
      type: object
      required: [machineCount, agentCount, agentsByPhase, machinesByPhase]
      properties:
        machineCount:
          type: integer
          description: Total number of machines
          example: 2
        agentCount:
          type: integer
          description: Total number of agents
          example: 5
        agentsByPhase:
          type: object
          description: Agent count grouped by phase
          additionalProperties:
            type: integer
          example:
            Running: 3
            Suspended: 2
        machinesByPhase:
          type: object
          description: Machine count grouped by phase
          additionalProperties:
            type: integer
          example:
            Running: 1
            Ready: 1

    MachineSpec:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [gce, gke, static, fake, mock]
          example: gce
        capacity:
          $ref: '#/components/schemas/MachineCapacity'
        machineType:
          type: string
          description: Managed-provider input. Required for gce/fake; absent for static/mock.
          example: n2-standard-4
        profile:
          type: string
          description: Provider-neutral managed compute profile. Preferred over the deprecated machineType alias.
          example: n2-standard-4
        diskSizeGb:
          type: integer
          format: int32
          minimum: 10
          description: Managed-provider input. Required for gce/fake; absent for static/mock.
          example: 100
        spot:
          type: boolean
          description: Managed-provider input. Absent for static/mock.
          example: false
        zone:
          type: string
          description: Managed-provider input. Required for gce/fake; absent for static/mock.
          example: us-central1-a
        location:
          type: string
          description: Opaque provider location. Preferred over the deprecated zone alias.
          example: us-central1-a
        interruptible:
          type: boolean
          description: Permit provider-initiated reclamation. Preferred over the deprecated spot alias.
        availabilityClass:
          type: string
          enum: [reliable, costOptimized]
        managementMode:
          type: string
          enum: [Managed, External]

    ConfigResponse:
      type: object
      required: [compute, models, identity]
      properties:
        compute:
          type: object
          required: [provider]
          properties:
            provider:
              type: string
              enum: [gce, gke, static, fake, mock, ""]
            managed:
              $ref: '#/components/schemas/ManagedComputeCapabilities'
            gceVMTypes:
              type: array
              deprecated: true
              items:
                $ref: '#/components/schemas/ComputeProfile'
        models:
          type: array
          items:
            type: object
        identity:
          type: object

    ManagedComputeCapabilities:
      type: object
      required: [profiles, locations, diskSizesGb, supportsInterruptible]
      properties:
        profiles:
          type: array
          items:
            $ref: '#/components/schemas/ComputeProfile'
        locations:
          type: array
          items:
            type: string
        diskSizesGb:
          type: array
          items:
            type: integer
            format: int32
        supportsInterruptible:
          type: boolean
        capabilities:
          $ref: '#/components/schemas/ComputeCapabilities'

    ComputeCapabilities:
      type: object
      required: [canProvision, canDiscoverExisting, suspendMode, deletionMode, supportsReliable, supportsInterruptible, supportsLocations, requiresSchedulerDemand]
      properties:
        canProvision:
          type: boolean
        canDiscoverExisting:
          type: boolean
        suspendMode:
          type: string
          enum: [Capacity, LogicalOnly, Unsupported]
        deletionMode:
          type: string
          enum: [DeleteCapacity, UnregisterOnly]
        supportsReliable:
          type: boolean
        supportsInterruptible:
          type: boolean
        supportsLocations:
          type: boolean
        requiresSchedulerDemand:
          type: boolean

    ComputeProfile:
      type: object
      required: [type, cpu, memory]
      properties:
        type:
          type: string
        cpu:
          type: string
        memory:
          type: string

    MachineCapacity:
      type: object
      required: [cpu, memory]
      description: Declared resource budget. Stamped from machineType on managed providers; user-supplied or detected on static/mock.
      properties:
        cpu:
          type: string
          example: "4"
        memory:
          type: string
          example: "16Gi"

    MachineStatus:
      type: object
      properties:
        phase:
          $ref: '#/components/schemas/MachinePhase'
        message:
          type: string
        instanceId:
          type: string
          deprecated: true
        providerRef:
          type: string
          description: Opaque provider-owned reference. Clients must not parse it.
        availability:
          type: string
          enum: [Pending, Available, Recovering, Offline, Absent, Failed, Unknown]
        resolvedProfile:
          $ref: '#/components/schemas/ResolvedMachineProfile'
        externalIP:
          type: string
        internalIP:
          type: string
        nodeName:
          type: string
        agentCount:
          type: integer
          format: int32

    ResolvedMachineProfile:
      type: object
      required: [id, capacity]
      properties:
        id:
          type: string
        displayName:
          type: string
        description:
          type: string
        capacity:
          $ref: '#/components/schemas/MachineCapacity'

    MachinePhase:
      type: string
      enum:
        - Provisioning
        - Ready
        - Running
        - Stopping
        - Stopped
        - Preempted
        - Replacing
        - Failed
        - Deleted
        - ""

    Machine:
      type: object
      required: [id, phase, spec, createdAt]
      properties:
        id:
          type: string
          example: worker-1
        phase:
          $ref: '#/components/schemas/MachinePhase'
        spec:
          $ref: '#/components/schemas/MachineSpec'
        status:
          $ref: '#/components/schemas/MachineStatus'
        createdAt:
          type: string
          format: date-time
          example: "2026-04-10T00:00:00Z"

    MachineList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Machine'

    CreateMachineRequest:
      type: object
      required: [name, provider]
      description: |-
        Provider-conditional request.
        - provider=gce/fake: machineType, diskSizeGb, zone are required; capacity is rejected (derived server-side).
        - provider=static/mock: capacity may be detected; machineType, diskSizeGb, spot, zone are rejected.
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-]{0,61}[a-z0-9]$'
          example: worker-1
        provider:
          type: string
          enum: [gce, gke, static, fake, mock]
          example: gce
        capacity:
          $ref: '#/components/schemas/MachineCapacity'
        machineType:
          type: string
          example: n2-standard-4
        diskSizeGb:
          type: integer
          format: int32
          minimum: 10
          example: 100
        spot:
          type: boolean
          default: false
          example: false
        zone:
          type: string
          example: us-central1-a
        profile:
          type: string
        location:
          type: string
        interruptible:
          type: boolean
        availabilityClass:
          type: string
          enum: [reliable, costOptimized]
        managementMode:
          type: string
          enum: [Managed, External]

    MachinePreflightResponse:
      type: object
      required: [valid, resolved, warnings]
      properties:
        valid:
          type: boolean
        resolved:
          type: object
          required: [provider, managementMode]
          properties:
            provider:
              type: string
            profile:
              type: string
            availabilityClass:
              type: string
              enum: [reliable, costOptimized]
            location:
              type: string
            managementMode:
              type: string
              enum: [Managed, External]
            diskSizeGb:
              type: integer
              format: int32
            capacity:
              $ref: '#/components/schemas/MachineCapacity'
        warnings:
          type: array
          items:
            type: string

    MachineCandidatesResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MachineCandidate'

    MachineCandidate:
      type: object
      required: [id, displayName]
      properties:
        id:
          type: string
          description: Opaque candidate identifier; clients must not parse it.
        displayName:
          type: string
        location:
          type: string
        capacity:
          $ref: '#/components/schemas/MachineCapacity'

    AgentPhase:
      type: string
      enum:
        - Creating
        - Starting
        - Running
        - Stopping
        - Stopped
        - Restarting
        - Failed
        - Suspended
        - Deleted
        - ""

    AgentResources:
      type: object
      required: [cpu, memory, disk]
      properties:
        cpu:
          type: string
          example: "1"
        memory:
          type: string
          example: 2Gi
        disk:
          type: string
          example: 50Gi

    AgentStatus:
      type: object
      properties:
        phase:
          $ref: '#/components/schemas/AgentPhase'
        podName:
          type: string
        podIP:
          type: string
        restartCount:
          type: integer
          format: int32
        message:
          type: string

    Agent:
      type: object
      required: [id, phase, machine, runtime, authType, model, scaling, resources, createdAt]
      properties:
        id:
          type: string
          example: dave
        phase:
          $ref: '#/components/schemas/AgentPhase'
        machine:
          type: string
          example: worker-1
        runtime:
          type: string
          example: claude-code
        authType:
          type: string
          enum: [oauth, api-key]
        model:
          type: string
          example: claude-sonnet-4
        currentModel:
          type: string
          description: Concrete model observed from the running runtime; populated after its first response when the harness chooses the default.
        scaling:
          type: string
          enum: [warm, scale-to-zero]
          example: warm
        resources:
          $ref: '#/components/schemas/AgentResources'
        status:
          $ref: '#/components/schemas/AgentStatus'
        createdAt:
          type: string
          format: date-time
          example: "2026-04-10T00:00:00Z"

    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'

    CreateAgentRequest:
      type: object
      required: [name, machine, runtime]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9][a-z0-9\-]{0,61}[a-z0-9]$'
          example: dave
        machine:
          type: string
          example: worker-1
        runtime:
          type: string
          example: claude-code
        model:
          type: string
          example: claude-sonnet-4
        scaling:
          type: string
          enum: [warm, scale-to-zero]
          default: warm
          example: warm
        resources:
          type: object
          properties:
            cpu:
              type: string
              example: "1"
            memory:
              type: string
              example: 2Gi
            disk:
              type: string
              example: 50Gi
        identity:
          type: object
          properties:
            soulDescription:
              type: string
        secrets:
          type: object
          properties:
            telegramEnabled:
              type: boolean
              default: false
            telegramBotToken:
              type: string
              writeOnly: true
            telegramAllowedUserIds:
              type: array
              items:
                type: string
            anthropicKey:
              type: string
            openaiApiKey:
              type: string
              writeOnly: true
            codexAuthJson:
              type: string
              description: Opaque auth.json from Codex ChatGPT login; write-only.
            authType:
              type: string
              enum: [oauth, api-key]
              default: oauth

    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: name is required
        field:
          type: string
          example: name

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

  responses:
    ValidationError:
      description: Bad request — validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: >
        Authenticated but not authorized — the caller's API key lacks the scope
        this verb requires (kyber#474/#565). The body is intentionally non-leaky
        (it names neither the required scope nor the caller's granted scopes).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    UnprocessableEntity:
      description: Request is valid but cannot be processed (e.g. machine has attached agents)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
