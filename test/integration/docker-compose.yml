services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kyber
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kyber
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyber"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
